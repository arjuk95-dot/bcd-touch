name: Touch sideload packages
on:
  push:
    branches: [package-733333d-existing]
    paths: [.github/workflows/touch-sideload-packages.yml]
  workflow_dispatch:
    inputs:
      source_run:
        description: Full-build run containing BCD-Touch-Lab-build
        required: true
        default: '42458316942'
      source_commit:
        description: App source commit embedded in that IPA
        required: true
        default: 733333d1d822b2e46798ce54021711d52c27add9
      source_sha256:
        description: SHA-256 of the source IPA
        required: true
        default: 12233f78347cc1fb757befa02429fced77288aa89891034adce77df96384f3e5
permissions:
  contents: read
  actions: read
concurrency:
  group: bcd-touch-sideload-packages
  cancel-in-progress: false
jobs:
  package:
    # Repackaging/codesign does not execute the ARM app or rebuild its engine.
    runs-on: macos-26-intel
    timeout-minutes: 15
    env:
      SOURCE_COMMIT: ${{ inputs.source_commit || '733333d1d822b2e46798ce54021711d52c27add9' }}
      SOURCE_SHA256: ${{ inputs.source_sha256 || '12233f78347cc1fb757befa02429fced77288aa89891034adce77df96384f3e5' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: BCD-Touch-Lab-build
          path: source-artifact
          run-id: ${{ inputs.source_run || '42458316942' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare update for the existing BCD slot
        run: >-
          python3 tools/touch-packs/package-sideload.py source-artifact/build-out/BCD-Touch-Lab-unsigned.ipa
          --mode existing --output update-package
          --expected-source "$SOURCE_COMMIT"
          --expected-ipa-sha "$SOURCE_SHA256"
      - uses: actions/upload-artifact@v4
        with:
          name: BCD-Touch-existing-update
          path: |
            update-package/BCD-Touch-update-existing-unsigned.ipa
            update-package/package-receipt.json
          retention-days: 7
      - name: Prepare the separate install with sideload entitlements
        run: >-
          python3 tools/touch-packs/package-sideload.py source-artifact/build-out/BCD-Touch-Lab-unsigned.ipa
          --mode separate --output separate-package
          --expected-source "$SOURCE_COMMIT"
          --expected-ipa-sha "$SOURCE_SHA256"
      - uses: actions/upload-artifact@v4
        with:
          name: BCD-Touch-Lab-sideload
          path: |
            separate-package/BCD-Touch-Lab-sideload-unsigned.ipa
            separate-package/package-receipt.json
          retention-days: 7
