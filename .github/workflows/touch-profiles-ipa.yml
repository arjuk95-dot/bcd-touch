    - name: Verify ntdll-unix exports the crypto call tables
      continue-on-error: true
      shell: bash
      run: "set +e\nOBJ=build/ntdll-unix/obj\n# nm's own flags do the filtering -- -g external, -U defined-only --\n# so match\
        \ on the symbol name alone. Anchoring the whole line\n# against \"addr TYPE _name\" is what made this check report\
        \ every\n# table missing even when the objects plainly defined them: the\n# archive-member output format does not\
        \ match that shape.\nnm -gU app/Madeira/libntdll_unix.a 2>/dev/null \\\n  | awk '{print $NF}' | sort -u > defined-syms.txt\n\
        echo \"defined external symbols in libntdll_unix.a: $(wc -l < defined-syms.txt | tr -d ' ')\"\nMISSING=\"\"\nfor s\
        \ in bcrypt_unix_call_funcs secur32_unix_call_funcs crypt32_unix_call_funcs \\\n         ws2_32_unix_call_funcs dwrite_unix_call_funcs\
        \ winedmo_unix_call_funcs \\\n         opengl32_unix_call_funcs opengl32_unix_call_wow64_funcs winevulkan_unix_call_funcs;\
        \ do\n  if grep -qx \"_$s\" defined-syms.txt; then\n    echo \"  OK   $s (defined)\"\n  else\n    echo \"  MISS $s\"\
        ; MISSING=\"$MISSING $s\"\n  fi\ndone\necho \"-- object sizes (an empty object means its #ifdef guard was off) --\"\
        \nfor o in ws2_32_unixlib bcrypt_unixlib secur32_unixlib crypt32_unixlib dwrite_unixlib winedmo_unixlib opengl32_wgl\
        \ opengl32_thunks winevulkan_vulkan winevulkan_thunks; do\n  if [ -f \"$OBJ/$o.o\" ]; then\n    printf '  %-18s %8s\
        \ bytes, %s external defs\\n' \"$o\" \\\n      \"$(wc -c < \"$OBJ/$o.o\" | tr -d ' ')\" \\\n      \"$(nm -gU \"$OBJ/$o.o\"\
        \ 2>/dev/null | wc -l | tr -d ' ')\"\n  else\n    echo \"  $o.o ABSENT\"\n  fi\ndone\nif [ -n \"$MISSING\" ]; then\n\
        \  echo \"-- raw nm shape for bcrypt_unixlib.o --\"\n  nm -gU \"$OBJ/bcrypt_unixlib.o\" 2>&1 | head -5 | cat -A |\
        \ head -5\n  echo \"::error::libntdll_unix.a defines none of ::$MISSING\"\n  for o in bcrypt_unixlib secur32_unixlib\
        \ crypt32_unixlib; do\n    if [ -s \"$OBJ/$o.err\" ]; then\n      E=$(grep -m4 -B1 -A4 \"error:\" \"$OBJ/$o.err\"\
        \ | head -c 1500 | python3 -c \"import sys; print('%0A'.join(sys.stdin.read().splitlines()))\")\n      echo \"::error::$o\
        \ compile errors :: $E\"\n    fi\n  done\n  exit 1\nfi\n"
