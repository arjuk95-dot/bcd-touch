name: BCD full approved batch validation and TEST IPA
'on':
  push:
    branches:
    - wo-bcd-profiles-native-001
    paths:
    - .github/workflows/touch-profiles-ipa.yml
concurrency:
  group: bcd-profiles-ipa
  cancel-in-progress: false
jobs:
  build-test-only:
    runs-on: macos-15-intel
    permissions:
      contents: read
      actions: read
    timeout-minutes: 90
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_UPGRADE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0
    - name: Verify clean source before combined native validation and build
      run: 'git diff --exit-code --ignore-submodules=none
    
        python3 - <<''CHECK''
    
        import subprocess
    
        assert all(s.startswith('' '') for s in subprocess.check_output([''git'',''submodule'',''status'',''--recursive''],text=True).splitlines())
    
        print(''One combined source validation and TEST IPA build. Phone testing still required.'')
    
        CHECK'
    - name: Verify exact historical patch sources before UI and native builds
      run: 'python3 tests/host/check-overlay-base.py

        python3 tests/host/check-overlay-base.py --verify-checkouts'
    - name: Restore pinned converter omitted from upstream Git tree
      run: python3 tools/touch-packs/stage-converter.py
    - name: Select the previously tested Xcode 26.3
      shell: bash
      run: 'test -d /Applications/Xcode_26.3.app

        sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer

        case "$(uname -m)" in arm64|x86_64) ;; *) exit 1 ;; esac

        xcodebuild -version

        '
    - name: Compile GL presenter before engine builds
      run: xcrun --sdk iphoneos clang -arch arm64 -miphoneos-version-min=17.0 -fobjc-arc -fmodules -Wall -c app/Madeira/Winios/WiniosGL.m
        -o /tmp/WiniosGL.o
    - name: Compile upstream display shim before engine builds
      run: xcrun --sdk iphoneos clang -arch arm64 -miphoneos-version-min=17.0 -fobjc-arc -fmodules -Wall -c app/Madeira/IOSDisplayShim.m
        -o /tmp/IOSDisplayShim.o
    - name: Build number
      id: bn
      shell: bash
      run: "n=$(grep -v '^#' docs/local-build/BUILD-NUMBER | tr -d '[:space:]')\ncase \"$n\" in\n  ''|*[!0-9]*) echo \"::error::docs/local-build/BUILD-NUMBER\
        \ holds no build number\"; exit 1 ;;\nesac\necho \"n=$n\" >> \"$GITHUB_OUTPUT\"\necho \"::notice::build $n (GitHub\
        \ run #${{ github.run_number }})\"\n"
    - name: Toolchain versions
      run: 'xcodebuild -version

        xcrun --sdk iphoneos --show-sdk-path

        xcrun --sdk iphoneos --show-sdk-version

        clang --version

        '
    - name: Verify preserved touch controls and source integration
      run: 'python3 tools/touch-packs/check-swift.py

        python3 tests/host/check-cursor-pack-desktop.py

        python3 tests/host/check-x86-entry-code.py

        python3 tests/opengl/check-game-setting.py'
    - name: Validate production touch renderer and essential interaction ownership
      run: python3 tools/touch-packs/simulator-preview.py
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: approved-profile-native-evidence
        path: touch-evidence
        retention-days: 7
    - name: Check control presets
      run: python3 tests/host/check-control-presets.py
    - name: Check preview build cache correctness
      run: python3 tests/host/check-ui-preview-cache.py
    - name: Check BCD's in-game layer
      run: python3 tests/host/check-bcd-session.py --require-swift --require-preview
    - name: Check the screen orientation lock
      run: python3 tests/host/check-bcd-orientation.py
    - name: Check the foldable iPhone support
      run: python3 tests/host/check-bcd-foldable.py
    - name: Check the native Duo interface
      run: 'python3 tests/host/check-duo-controller-navigation.py

        python3 tests/host/check-duo-download-session.py

        python3 tests/host/check-desktop-quit.py

        '
    - name: Check the keyboard's Done button
      run: python3 tests/host/check-bcd-keyboard-done.py
    - name: Check shareable control layouts
      run: python3 tests/host/check-bcd-control-share.py --require-swift
    - name: Check the performance HUD
      run: python3 tests/host/check-bcd-hud.py --require-swift
    - name: Check clip dedupe
      run: python3 tests/host/check-clip-dedupe.py
    - name: Check d3d11 src
      run: python3 tests/host/check-d3d11-src.py
    - name: Check round 624 log lines
      run: 'python3 tests/host/check-d3d12-fail-log.py

        python3 tests/host/check-round624-log-lines.py

        python3 tests/host/check-wineserver-bind-fallback.py

        python3 tests/host/check-gdi-table-child.py

        python3 tests/host/check-wow-unity-plain.py

        python3 tests/host/check-present-lum.py

        python3 tests/host/check-no-input-hint.py

        python3 tests/host/check-windowed-hint.py

        python3 tests/host/check-open-url.py

        python3 tests/host/check-win-text.py

        if [ -f tools/cluster-logs.py ] && [ -f tools/log-facts.py ]; then python3 tests/host/check-cluster-logs.py; else
        echo "::notice::NOT RUN: upstream private log triage sources are absent from the public release"; fi

        python3 tests/host/check-fex-fault-diag.py

        python3 tests/host/check-early-fault.py

        python3 tests/host/check-log-upload-guard.py

        python3 tests/host/check-jit-brk-trail.py

        python3 tests/host/check-ill-insn-diag.py

        python3 tests/host/check-installs-countdown.py

        python3 tests/host/check-kernelbase-optin.py

        python3 tests/host/check-fex-alias-capacity.py

        python3 tests/host/check-fex-ec-teardown-ctx.py

        python3 tests/host/check-fex-cpuid-classic.py

        python3 tests/host/check-fex-thread-init-nomem.py

        python3 tests/host/check-fex-exit-runaway.py

        python3 tests/host/check-fex-inval-null-thread.py

        python3 tests/host/check-fex-processorid.py

        python3 tests/host/check-fex-moffs-rip.py

        python3 tests/host/check-ntdll-rtcs-null-area.py

        python3 tests/host/check-fex-allocwatch-clear.py

        python3 tests/host/check-fex-threadterm-clear-area.py

        python3 tests/host/check-fex-repne-bit-ops.py

        python3 tests/host/check-fex-dep-promote-stale.py

        python3 tests/host/check-fex-pool-alloc-null.py

        python3 tests/host/check-fex-process-term.py

        python3 tests/host/check-fex-wow-recursive-tcm.py

        python3 tests/host/check-fex-notify-nocpuarea.py

        python3 tests/host/check-thread-sample-syscall.py

        python3 tests/host/check-usd-osversion.py

        python3 tests/host/check-thread-fault-isolate.py

        python3 tests/host/check-display-rate.py

        python3 tests/host/check-display-hz.py

        python3 tests/host/check-x64-nocopy-dataimp.py

        python3 tests/host/check-pe-module-name-safe.py

        python3 tests/host/check-diag-module-name.py

        python3 tests/host/check-ctx-null.py

        python3 tests/host/check-hint-storm.py

        python3 tests/host/check-fd-pollout-guard.py

        python3 tests/host/check-dock-install-skip.py

        python3 tests/host/check-godot-composition.py

        python3 tests/host/check-clr-death-diag.py

        python3 tests/host/check-crypt32-root-enum.py

        python3 tests/host/check-gpu-stall.py

        python3 tests/host/check-gpu-time-wow64.py

        python3 tests/host/check-noexec-who.py

        python3 tests/host/check-desktop-shell.py

        python3 tests/host/check-d9-texfmt.py

        python3 tests/host/check-d9-query-stuck.py

        python3 tests/host/check-d11-query-stuck.py

        python3 tests/host/check-soft-pool-decommit.py

        python3 tests/host/check-mem-burst.py

        '
    - name: Check dxmt patch chain
      run: python3 tests/host/check-dxmt-patch-chain.py
    - name: Check frame generation follows one layer
      run: python3 tests/host/check-dxmt-framegen-one-layer.py
    - name: Check gamepad
      run: python3 tests/host/check-gamepad.py
    - name: Check controller profile re-read
      run: python3 tests/host/check-gamepad-profile.py --require-swift
    - name: Check hidpad
      run: python3 tests/host/check-hidpad.py
    - name: Check pad output
      run: python3 tests/host/check-pad-output.py
    - name: Check runtime settings
      run: python3 tests/host/check-runtime-settings.py
    - name: Check touch gamepad
      run: python3 tests/host/check-touch-gamepad.py
    - name: Check vmon identity
      run: python3 tests/host/check-vmon-identity.py
    - name: Check window coordinates
      run: python3 tests/host/check-window-coordinates.py
    - name: Check window visibility
      run: python3 tests/host/check-window-visibility.py
    - name: Check the rumble's CoreHaptics guard
      run: python3 tests/host/check-pad-output-haptics-guard.py
    - name: Check the farm completeness guard
      run: python3 tests/host/check-farm-imports.py
    - name: Check BCD's interface in the app
      run: python3 tests/host/check-bcd-live.py --require-swift
    - name: Check BCD's game page
      run: python3 tests/host/check-bcd-game-page.py --require-swift
    - name: Check BCD's library and Add a game
      run: python3 tests/host/check-bcd-library.py --require-swift
    - name: Check the library's graphics API detection
      run: python3 tests/host/check-library-api.py
    - name: Check OpenGL (the key and everything behind it)
      run: python3 tests/host/check-opengl-key.py
    - name: Check OpenGL (the game page, the Settings note, the catalog, the lists and auto-tune)
      run: python3 tests/host/check-opengl-ui.py --require-swift
    - name: Check the opt-in monitor that follows a borderless window
      run: python3 tests/host/check-display-follow-borderless.py
    - name: Check the recreated-surface census in the window tree
      run: python3 tests/host/check-winios-surface-recreated.py
    - name: Check the OpenGL frame probe
      run: python3 tests/host/check-gl-probe.py
    - name: Check the HID controller's one-minute line
      run: python3 tests/host/check-hidpad-minute.py
    - name: Check BCD's menus
      run: python3 tests/host/check-bcd-menu.py --require-swift
    - name: Check BCD's touch controls
      run: python3 tests/host/check-bcd-touch.py --require-swift
    - name: Check the extra keys
      run: python3 tests/host/check-bcd-extra-keys.py --require-swift
    - name: Check the BCD in-game menu items
      run: python3 tests/host/check-bcd-menu-items.py --require-swift
    - name: Check turbo and macros
      run: python3 tests/host/check-bcd-turbo.py --require-swift
    - name: Check players
      run: python3 tests/host/check-bcd-players.py --require-swift
    - name: Check radial menu
      run: python3 tests/host/check-bcd-radial.py --require-swift
    - name: Check aim mode, touch gestures and the Apple Pencil
      run: python3 tests/host/check-bcd-touch-extras.py --require-swift
    - name: Check the gamepad model picker
      run: python3 tests/host/check-bcd-padmodel.py --require-swift
    - name: Check touch-control look
      run: python3 tests/host/check-bcd-touch-look.py --require-swift
    - name: Check gyro aim
      run: python3 tests/host/check-bcd-gyro.py --require-swift
    - name: Check BCD's Settings
      run: python3 tests/host/check-bcd-settings.py
    - name: Check the app sources are in the Xcode project
      run: python3 tests/host/check-xcode-sources.py
    - name: Check BCD's controller hub
      run: python3 tests/host/check-controller-hub.py --require-swift
    - name: Install newer bison (macOS ships an ancient 2.3)
      run: 'brew install bison

        echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"

        '
    - name: Select LLVM tools without building a host compiler from source
      shell: bash
      run: "if [ \"$(uname -m)\" = x86_64 ]; then\n  # Current Homebrew LLVM bottles omit Intel macOS. The macOS 15\n  # image\
        \ already carries these tools; actual PE compilers below\n  # remain the pinned universal llvm-mingw 20260421 distribution.\n\
        \  prefix=$(brew --prefix llvm@18)\n  for tool in llvm-dlltool llvm-objcopy ld.lld; do test -x \"$prefix/bin/$tool\"\
        ; done\n  echo \"$prefix/bin\" >> \"$GITHUB_PATH\"\n  \"$prefix/bin/clang\" --version\nelse\n  brew install llvm lld\n\
        \  echo \"$(brew --prefix llvm)/bin\" >> \"$GITHUB_PATH\"\n  echo \"$(brew --prefix lld)/bin\" >> \"$GITHUB_PATH\"\
        \nfi\n"
    - name: Wine submodule revision
      id: winerev
      shell: bash
      run: echo "sha=$(git -C wine rev-parse HEAD)" >> "$GITHUB_OUTPUT"
    - name: Check the Wine pin has the OpenGL change
      run: python3 tests/host/check-opengl-wine.py
    - name: Work around wine's uncommitted arm64ec_x64_export_iat.c
      shell: bash
      run: "F=wine/dlls/ntdll/arm64ec_x64_export_iat.c\nif [ -f \"$F\" ]; then\n  echo \"::notice::$F is present upstream\
        \ now -- this step can go\"\nelse\n  printf '/* placeholder: see build-ipa.yml; PE-side only, never compiled here\
        \ */\\n' > \"$F\"\n  echo \"::warning::$F missing from the wine fork -- empty placeholder written for makedep\"\n\
        fi\n# dlls/ntdll/unix/sync.c includes build/madeira_cfg.h BEFORE config.h,\n# on purpose (ml1122: Wine's headers ban\
        \ strncpy by macro). makedep\n# treats that ordering as fatal, so configure never writes a\n# Makefile. Upstream builds\
        \ from a long-configured tree and never\n# meets it. Make that one sanity check a warning.\nMD=wine/tools/makedep.c\n\
        python3 - \"$MD\" <<'PYEOF'\nimport sys\np = sys.argv[1]\ns = open(p).read()\nold = 'fatal_error( \"%s must be included\
        \ before other headers\\\\n\", file->name );'\nnew = ('fprintf( stderr, \"%s:%d: warning: %s must be included before\
        \ other headers '\n       '(madeira-bcd CI: not fatal)\\\\n\", input_file_name, input_line, file->name );')\nif new\
        \ in s:\n    print(\"makedep: already patched\")\nelif s.count(old) == 1:\n    open(p, \"w\").write(s.replace(old,\
        \ new))\n    print(\"makedep: config.h ordering check is now a warning\")\nelse:\n    print(\"::error::makedep.c anchor\
        \ not found -- wine moved, review this step\")\n    sys.exit(1)\n# The WoW64 series' wine (125hz pr/wow64-core) includes\
        \ Madeira's\n# iOS shim headers (ios_fastsync.h, ios_srv_stats.h, ...) by bare\n# name; the iOS builds find them with\
        \ -I build/ntdll-unix/shims,\n# makedep does not and stops configure. They are outside the tree\n# like a system header,\
        \ so skip them the way makedep skips those.\ns = open(p).read()\nold = '    if (make->external) return NULL; /* ignore\
        \ missing files in external libs */\\n'\nnew = old + ('    if (!strncmp( source->name, \"ios_\", 4 )) return NULL;\
        \  '\n             '/* madeira-bcd CI: build/ntdll-unix/shims */\\n')\nif new in s:\n    print(\"makedep: ios_* shims\
        \ already skipped\")\nelif s.count(old) == 1:\n    open(p, \"w\").write(s.replace(old, new))\n    print(\"makedep:\
        \ missing ios_* shim headers are skipped\")\nelse:\n    print(\"::error::makedep.c external-lib anchor not found --\
        \ wine moved, review this step\")\n    sys.exit(1)\nPYEOF\n"
    - name: Restore native wine tools
      id: winenative
      uses: actions/cache/restore@v4
      with:
        path: wine/build-native
        key: wine-native-v1-${{ steps.winerev.outputs.sha }}
    - name: 'Build native wine (for host-side tools: widl/wrc/wmc)'
      if: steps.winenative.outputs.cache-hit != 'true'
      run: "cd wine\nmkdir -p build-native\ncd build-native\n# LOCAL (x86_64 Mac): an x86_64 host's configure defaults to\
        \ a 32-bit Wine,\n# which macOS cannot build (\"gcc -m32 works... no\"); arm64 hosts are 64-bit.\nW64=\"\"; [ \"$(uname\
        \ -m)\" = x86_64 ] && W64=--enable-win64\n../configure $W64 > \"$GITHUB_WORKSPACE/wine-native-configure.log\" 2>&1\
        \ || true\n# Only the host tools and the generated headers are used from this\n# tree. A full host build also compiles\
        \ the iOS-only unix sources\n# for macOS, and one failure there used to stop make before widl.\nN=$(sysctl -n hw.ncpu)\n\
        { make -j\"$N\" __tools__ && make -j\"$N\" include; } > \"$GITHUB_WORKSPACE/wine-native-make.log\" 2>&1 \\\n  || make\
        \ -k -j\"$N\" >> \"$GITHUB_WORKSPACE/wine-native-make.log\" 2>&1 || true\n"
    - name: Save native wine tools
      if: steps.winenative.outputs.cache-hit != 'true' && hashFiles('wine/build-native/tools/widl/widl') != ''
      uses: actions/cache/save@v4
      with:
        path: wine/build-native
        key: wine-native-v1-${{ steps.winerev.outputs.sha }}
    - name: Diagnose native wine tools build
      run: "echo \"-- looking for widl (proof the native tools built) --\"\nfind wine/build-native/tools -maxdepth 2 -name\
        \ \"widl*\" 2>&1 || echo \"not found\"\nif [ ! -x wine/build-native/tools/widl/widl ]; then\n  echo \"::error::native\
        \ widl NOT built -- dumping tails\"\n  NCTAIL=$(tail -n 30 wine-native-configure.log 2>/dev/null | python3 -c \"import\
        \ sys; print('%0A'.join(sys.stdin.read().splitlines()))\")\n  echo \"::error::native configure TAIL :: $NCTAIL\"\n\
        \  NMTAIL=$(tail -n 40 wine-native-make.log 2>/dev/null | python3 -c \"import sys; print('%0A'.join(sys.stdin.read().splitlines()))\"\
        )\n  echo \"::error::native make TAIL :: $NMTAIL\"\nelse\n  echo \"::notice::native widl built OK\"\nfi\n"
    - name: Configure wine (build-macos, cross)
      run: "cd wine\nmkdir -p build-macos\ncd build-macos\n../configure --enable-win64 --disable-tests \\\n  CC=\"xcrun -sdk\
        \ iphoneos clang -arch arm64 -miphoneos-version-min=17.0\" \\\n  CROSSCC=\"xcrun -sdk iphoneos clang -arch arm64 -miphoneos-version-min=17.0\"\
        \ \\\n  --host=aarch64-apple-darwin --build=x86_64-apple-darwin \\\n  --with-wine-tools=\"$GITHUB_WORKSPACE/wine/build-native\"\
        \ \\\n  --without-freetype --without-fontconfig \\\n  --without-x --without-opengl --without-vulkan \\\n  --without-gnutls\
        \ --without-pcsclite --without-usb \\\n  --without-v4l2 --without-gphoto --without-inotify \\\n  --without-sane --without-pulse\
        \ --without-alsa --without-oss \\\n  --without-capi --without-cups --without-krb5 --without-ldap \\\n  --without-netapi\
        \ --without-sdl --without-udev --without-unwind \\\n  > \"$GITHUB_WORKSPACE/wine-configure.log\" 2>&1 || true\n"
    - name: Generate cross-tree headers and patch config.h for iOS SDK
      shell: bash
      run: "make -C wine/build-macos include -j\"$(sysctl -n hw.ncpu)\" > \"$GITHUB_WORKSPACE/make-include.log\" 2>&1 || true\n\
        cp -n wine/build-native/include/*.h wine/build-macos/include/ 2>/dev/null || true\nCFG=wine/build-macos/include/config.h\n\
        {\n  echo \"\"\n  echo \"/* iOS SDK fixups appended by CI */\"\n  echo \"#undef HAVE_GETATTRLIST\"\n  echo \"#ifndef\
        \ D_TAPE\"\n  echo \"#define D_TAPE 1\"\n  echo \"#endif\"\n  echo \"#ifndef D_DISK\"\n  echo \"#define D_DISK 2\"\
        \n  echo \"#endif\"\n  echo \"#ifndef D_TTY\"\n  echo \"#define D_TTY 3\"\n  echo \"#endif\"\n  echo \"\"\n  echo\
        \ \"/* Wine configure runs --without-gnutls here (the host has no\"\n  echo \" * gnutls for the iOS sysroot), so config.h\
        \ defines neither of\"\n  echo \" * these. But dlls/bcrypt/gnutls.c is wrapped head-to-toe in\"\n  echo \" * #ifdef\
        \ HAVE_GNUTLS_CIPHER_INIT and dlls/secur32/schannel_gnutls.c\"\n  echo \" * in #ifdef SONAME_LIBGNUTLS -- undefined,\
        \ both compile to an\"\n  echo \" * EMPTY object, __wine_unix_call_funcs is never emitted, and the\"\n  echo \" *\
        \ app link dies on _bcrypt_unix_call_funcs / _secur32_unix_call_funcs.\"\n  echo \" * We link toolchains/gnutls-ios\
        \ statically and ios_gnutls_shim.h\"\n  echo \" * rewrites dlopen/dlsym onto a static symtab, so the soname string\"\
        \n  echo \" * is only ever pattern-matched, never actually dlopen()ed. */\"\n  echo \"#ifndef SONAME_LIBGNUTLS\"\n\
        \  echo \"#define SONAME_LIBGNUTLS \\\"libgnutls.so.30\\\"\"\n  echo \"#endif\"\n  echo \"#ifndef HAVE_GNUTLS_CIPHER_INIT\"\
        \n  echo \"#define HAVE_GNUTLS_CIPHER_INIT 1\"\n  echo \"#endif\"\n} >> \"$CFG\"\nif [ -f wine/build-macos/include/dwrite.h\
        \ ]; then\n  echo \"::notice::dwrite.h present in cross tree\"\nelse\n  echo \"::error::dwrite.h STILL MISSING\"\n\
        \  LS=$(ls wine/build-native/include/ 2>&1 | head -40 | python3 -c \"import sys; print('%0A'.join(sys.stdin.read().splitlines()))\"\
        )\n  echo \"::error::native include dir :: $LS\"\n  T=$(tail -n 20 \"$GITHUB_WORKSPACE/make-include.log\" 2>/dev/null\
        \ | python3 -c \"import sys; print('%0A'.join(sys.stdin.read().splitlines()))\")\n  echo \"::error::make include tail\
        \ :: $T\"\nfi\n"
    - name: Diagnose wine build-macos state
      run: "echo \"-- listing wine/build-macos (depth 2) --\"\nfind wine/build-macos -maxdepth 2 2>&1 | head -60 || echo \"\
        wine/build-macos missing entirely\"\nif [ -f wine/build-macos/include/config.h ]; then\n  echo \"::notice::config.h\
        \ EXISTS, $(wc -l < wine/build-macos/include/config.h) lines\"\nelse\n  echo \"::error::config.h MISSING at wine/build-macos/include/config.h\
        \ -- configure did not actually produce it\"\n  LINES=$(wc -l < wine-configure.log 2>/dev/null || echo 0)\n  echo\
        \ \"::error::wine-configure.log has $LINES lines total\"\n  HEAD=$(head -n 25 wine-configure.log 2>/dev/null | python3\
        \ -c \"import sys; print('%0A'.join(sys.stdin.read().splitlines()))\")\n  echo \"::error::configure HEAD :: $HEAD\"\
        \n  TAIL=$(tail -n 40 wine-configure.log 2>/dev/null | python3 -c \"import sys; print('%0A'.join(sys.stdin.read().splitlines()))\"\
        )\n  echo \"::error::configure TAIL :: $TAIL\"\nfi\n"
    - name: Clone freetype 2.13.3
      run: git clone --depth 1 --branch VER-2-13-3 https://github.com/freetype/freetype.git research/freetype
    - name: Build freetype-ios
      run: bash build/freetype-ios/build.sh
    - name: Restore GnuTLS iOS stack
      id: gnutlscache
      uses: actions/cache/restore@v4
      with:
        path: 'toolchains/gnutls-ios

          build/gnutls-ios/obj

          build/gnutls-ios/src

          '
        key: gnutls-ios-gmp6.3.0-nettle3.10.1-gnutls3.8.9-v1
    - name: Build GnuTLS stack for iOS
      if: steps.gnutlscache.outputs.cache-hit != 'true'
      run: bash build/gnutls-ios/build.sh
    - name: Verify GnuTLS iOS headers and libs
      shell: bash
