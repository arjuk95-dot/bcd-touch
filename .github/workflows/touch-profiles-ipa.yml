    - name: Fetch the VC++ runtime DLLs from Microsoft
      shell: bash
      run: "set +e\nshopt -s nullglob\nDEST=\"$GITHUB_WORKSPACE/app/Madeira/x86_64-vcruntime\"\nWANT=\"concrt140.dll msvcp140.dll\
        \ msvcp140_1.dll msvcp140_2.dll\n      msvcp140_atomic_wait.dll msvcp140_codecvt_ids.dll vcamp140.dll\n      vccorlib140.dll\
        \ vcomp140.dll vcruntime140.dll vcruntime140_1.dll\n      vcruntime140_threads.dll mfc140.dll mfc140u.dll\"\nNWANT=$(echo\
        \ $WANT | wc -w | tr -d ' ')\ncommand -v cabextract >/dev/null 2>&1 || brew install cabextract\ncommand -v msiextract\
        \ >/dev/null 2>&1 || brew install msitools\n\ncurl -fL --retry 3 --retry-delay 2 -o /tmp/vcr.exe \\\n  https://aka.ms/vs/17/release/vc_redist.x64.exe\n\
        if [ ! -s /tmp/vcr.exe ]; then\n  echo \"::warning::VC_redist.x64.exe download failed -- MSVC games will not start\"\
        \n  exit 0\nfi\necho \"downloaded $(wc -c < /tmp/vcr.exe | tr -d ' ') bytes\"\n\nrm -rf /tmp/vcx; mkdir -p /tmp/vcx/a\
        \ /tmp/vcx/carve\ncabextract -q -d /tmp/vcx/a /tmp/vcr.exe 2>&1 | tail -3\n\n# Only if the scan came up empty: carve\
        \ every cabinet out by its\n# MSCF header and its own declared length.\nif [ \"$(find /tmp/vcx/a -type f | wc -l |\
        \ tr -d ' ')\" -lt 2 ]; then\n  python3 - <<'PYEOF'\nimport struct\nd = open('/tmp/vcr.exe', 'rb').read()\nn = off\
        \ = 0\nwhile True:\n    i = d.find(b'MSCF', off)\n    if i < 0:\n        break\n    cb = struct.unpack_from('<I',\
        \ d, i + 8)[0] if i + 36 <= len(d) else 0\n    if 1000 < cb <= len(d) - i:\n        open('/tmp/vcx/carve/c%d.cab'\
        \ % n, 'wb').write(d[i:i + cb])\n        n += 1\n        off = i + cb\n    else:\n        off = i + 4\nprint('carved\
        \ %d cabinet(s) by MSCF header' % n)\nPYEOF\nfi\n\n# The payloads are named <name>.dll_amd64 and <name>.dll_arm64\
        \ --\n# not <name>.dll, and not the F_CENTRAL_<name>_x64 an MSI cab would\n# use. Rather than chase the spelling,\
        \ read each candidate's PE\n# header and take the one whose machine field is AMD64 (0x8664).\n# Picking up the arm64\
        \ build by mistake would fail silently: FEX\n# emulates x86-64, so an ARM64 DLL is the wrong binary in a file\n# with\
        \ the right name.\nis_x64() {\n  python3 -c \"\nimport struct, sys\nd = open(sys.argv[1], 'rb').read()\npe = struct.unpack_from('<I',\
        \ d, 0x3c)[0] if len(d) > 0x40 else 0\nok = d[pe:pe+4] == b'PE\\\\0\\\\0' and struct.unpack_from('<H', d, pe+4)[0]\
        \ == 0x8664\nsys.exit(0 if ok else 1)\" \"$1\" 2>/dev/null\n}\n\ncollect() {\n  FOUND=0; MISSING=\"\"\n  for d in\
        \ $WANT; do\n    base=\"${d%.dll}\"\n    src=\"\"\n    while IFS= read -r cand; do\n      if is_x64 \"$cand\"; then\
        \ src=\"$cand\"; break; fi\n    done < <(find /tmp/vcx -type f \\\n               \\( -iname \"$base.dll*\" -o -iname\
        \ \"F_CENTRAL_${base}_*\" \\) \\\n               -print 2>/dev/null)\n    if [ -n \"$src\" ]; then\n      cp \"$src\"\
        \ \"$DEST/$d\" && FOUND=$((FOUND+1))\n    else\n      MISSING=\"$MISSING $d\"\n    fi\n  done\n}\n\n# Peel containers\
        \ until all of them turn up, or nothing new appears.\nfor pass in 1 2 3 4; do\n  BEFORE=$(find /tmp/vcx -type f 2>/dev/null\
        \ | wc -l | tr -d ' ')\n  find /tmp/vcx -type f -size +20k 2>/dev/null | while IFS= read -r f; do\n    case \"${f##*/}\"\
        \ in *.dll|*.DLL|*.exe|*.EXE|*_amd64|*_arm64|*_x86) continue ;; esac\n    [ -d \"$f.d\" ] && continue\n    mkdir -p\
        \ \"$f.d\"\n    cabextract -q -d \"$f.d\" \"$f\" > /dev/null 2>&1 \\\n      || msiextract -C \"$f.d\" \"$f\" > /dev/null\
        \ 2>&1 \\\n      || rmdir \"$f.d\" 2>/dev/null\n  done\n  AFTER=$(find /tmp/vcx -type f 2>/dev/null | wc -l | tr -d\
        \ ' ')\n  collect\n  echo \"pass $pass: $BEFORE -> $AFTER files, $FOUND of $NWANT recovered\"\n  [ \"$FOUND\" -eq\
        \ \"$NWANT\" ] && break\n  [ \"$BEFORE\" = \"$AFTER\" ] && break\ndone\n\necho \"::notice::vcruntime :: recovered\
        \ $FOUND of $NWANT$([ -n \"$MISSING\" ] && echo \" -- missing:$MISSING\")\"\n\nif [ \"$FOUND\" -lt \"$NWANT\" ]; then\n\
        \  echo \"-- what the installer actually unpacked to (biggest 40) --\"\n  find /tmp/vcx -type f -size +20k -exec ls\
        \ -S {} + 2>/dev/null \\\n    | head -40 | sed \"s|/tmp/vcx/||\"\nfi\n\n# tools/fetch-vcruntime.md: a truncated certificate\
        \ table means the\n# file is no longer an unmodified Microsoft binary.\npython3 - \"$DEST\"/*.dll <<'PYEOF' || true\n\
        import struct, sys\nfor path in sys.argv[1:]:\n    d = open(path, 'rb').read()\n    pe = struct.unpack_from('<I',\
        \ d, 0x3c)[0]\n    off, size = struct.unpack_from('<II', d, pe + 24 + 112 + 4*8)\n    ok = size and off + size <=\
        \ len(d)\n    print(('  signed  ' if ok else '  UNSIGNED'), path.split('/')[-1])\nPYEOF\n"
