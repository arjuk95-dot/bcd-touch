    - name: Install ninja/meson and fetch llvm-mingw
      shell: bash
      run: "brew install ninja meson\nmkdir -p toolchains\nMINGW=toolchains/llvm-mingw-20260421-ucrt-macos-universal\nif [\
        \ -x \"$MINGW/bin/arm64ec-w64-mingw32-clang++\" ]; then\n  echo \"::notice::llvm-mingw restored from cache\"\n  echo\
        \ \"MINGW_OK=1\" >> \"$GITHUB_ENV\"\nelse\n  # Piping curl into tar hid a failed download. Run 71 received 92\n  #\
        \ bytes of error page, tar said \"Unrecognized archive format\", the\n  # step exited 0, and the IPA shipped the committed\
        \ xtajit64.dll\n  # instead of ours -- with the job green throughout. Download to a\n  # file, retry, and check what\
        \ arrived before unpacking.\n  URL=https://github.com/mstorsjo/llvm-mingw/releases/download/20260421/llvm-mingw-20260421-ucrt-macos-universal.tar.xz\n\
        \  for try in 1 2 3; do\n    curl -fL --retry 3 --retry-delay 5 -o /tmp/mingw.tar.xz \"$URL\" && break\n    echo \"\
        download attempt $try failed\"\n    sleep $((try * 5))\n  done\n  SZ=$(wc -c < /tmp/mingw.tar.xz 2>/dev/null || echo\
        \ 0)\n  echo \"downloaded $SZ bytes\"\n  if [ \"$SZ\" -lt 10000000 ]; then\n    echo \"::error::llvm-mingw download\
        \ failed -- $SZ bytes is not an archive; \\\nthe IPA will carry the COMMITTED xtajit64.dll, not the one we build\"\
        \n  else\n    tar -xJf /tmp/mingw.tar.xz -C toolchains/\n    echo \"::notice::llvm-mingw unpacked ($SZ bytes)\"\n\
        \    echo \"MINGW_OK=1\" >> \"$GITHUB_ENV\"\n  fi\nfi\nls toolchains/\n"
