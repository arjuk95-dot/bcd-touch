    - name: Restore LLVM 15.0.7 iOS build
      id: llvmcache
      uses: actions/cache/restore@v4
      with:
        path: 'toolchains/llvm-ios-build

          toolchains/llvm-project

          '
        key: llvm-15.0.7-ios-v2
    - name: Build LLVM 15.0.7 for iOS (two-stage, per build/dxmt-ios/README.md)
      if: steps.llvmcache.outputs.cache-hit != 'true'
      continue-on-error: true
      shell: bash
      run: "git clone --depth 1 --branch llvmorg-15.0.7 \\\n  https://github.com/llvm/llvm-project.git toolchains/llvm-project\n\
        # README: Apple ld rejects --gc-sections; make the Darwin branch cover iOS\nsed -i '' 's/MATCHES \"Darwin\"/MATCHES\
        \ \"Darwin|iOS\"/' \\\n  toolchains/llvm-project/llvm/cmake/modules/AddLLVM.cmake\ngrep -n 'Darwin|iOS' toolchains/llvm-project/llvm/cmake/modules/AddLLVM.cmake\
        \ | head\n\n# stage 1: host llvm-tblgen only (use Xcode clang, not brew's newer one)\ncmake -S toolchains/llvm-project/llvm\
        \ -B toolchains/llvm-host-build -G Ninja \\\n  -DCMAKE_BUILD_TYPE=Release \\\n  -DCMAKE_C_COMPILER=/usr/bin/clang\
        \ -DCMAKE_CXX_COMPILER=/usr/bin/clang++ \\\n  -DLLVM_TARGETS_TO_BUILD=\"\" -DLLVM_INCLUDE_TESTS=Off \\\n  -DLLVM_INCLUDE_EXAMPLES=Off\
        \ -DLLVM_INCLUDE_BENCHMARKS=Off \\\n  > \"$GITHUB_WORKSPACE/llvm-host-cfg.log\" 2>&1\ncmake --build toolchains/llvm-host-build\
        \ --target llvm-tblgen \\\n  -j\"$(sysctl -n hw.ncpu)\" > \"$GITHUB_WORKSPACE/llvm-host-build.log\" 2>&1\n\n# stage\
        \ 2: iOS target libs, reusing host tblgen\ncmake -S toolchains/llvm-project/llvm -B toolchains/llvm-ios-build -G Ninja\
        \ \\\n  -DCMAKE_SYSTEM_NAME=iOS \\\n  -DCMAKE_OSX_SYSROOT=\"$(xcrun --sdk iphoneos --show-sdk-path)\" \\\n  -DCMAKE_OSX_ARCHITECTURES=arm64\
        \ \\\n  -DCMAKE_OSX_DEPLOYMENT_TARGET=17.0 \\\n  -DCMAKE_BUILD_TYPE=Release \\\n  -DCMAKE_C_COMPILER=/usr/bin/clang\
        \ -DCMAKE_CXX_COMPILER=/usr/bin/clang++ \\\n  -DLLVM_TABLEGEN=\"$GITHUB_WORKSPACE/toolchains/llvm-host-build/bin/llvm-tblgen\"\
        \ \\\n  -DCMAKE_MACOSX_BUNDLE=OFF \\\n  -DLLVM_BUILD_UTILS=Off -DLLVM_BUILD_TOOLS=Off \\\n  -DLLVM_TARGETS_TO_BUILD=\"\
        \" \\\n  -DLLVM_INCLUDE_TESTS=Off -DLLVM_INCLUDE_EXAMPLES=Off \\\n  -DLLVM_INCLUDE_BENCHMARKS=Off -DLLVM_INCLUDE_UTILS=Off\
        \ \\\n  -DLLVM_ENABLE_TERMINFO=Off -DLLVM_ENABLE_LIBXML2=Off \\\n  -DLLVM_ENABLE_ZSTD=Off -DLLVM_ENABLE_ZLIB=Off \\\
        \n  > \"$GITHUB_WORKSPACE/llvm-ios-cfg.log\" 2>&1\ncmake --build toolchains/llvm-ios-build -j\"$(sysctl -n hw.ncpu)\"\
        \ \\\n  > \"$GITHUB_WORKSPACE/llvm-ios-build.log\" 2>&1\n"
    - name: Verify LLVM iOS build
      if: always()
      shell: bash
      run: "set +e\nshopt -s nullglob\nLIBS=(toolchains/llvm-ios-build/lib/*.a)\nN=${#LIBS[@]}\necho \"llvm-ios-build static\
        \ libs: $N\"\necho \"::notice::llvm-ios-build has $N static libs\"\necho \"-- toolchains tree --\"\nls -la toolchains\
        \ 2>&1 | head -20\nls -la toolchains/llvm-ios-build 2>&1 | head -20\nif [ \"$N\" -lt 5 ]; then\n  for L in llvm-host-cfg\
        \ llvm-host-build llvm-ios-cfg llvm-ios-build; do\n    if [ -f \"$L.log\" ]; then\n      T=$(tail -n 30 \"$L.log\"\
        \ | python3 -c \"import sys; print('%0A'.join(sys.stdin.read().splitlines()))\")\n      echo \"::error::$L.log tail\
        \ :: $T\"\n    else\n      echo \"::error::$L.log MISSING\"\n    fi\n  done\n  exit 1\nfi\n"
    - name: Save LLVM 15.0.7 iOS build
      if: steps.llvmcache.outputs.cache-hit != 'true' && hashFiles('toolchains/llvm-ios-build/lib/libLLVMCore.a') != ''
      uses: actions/cache/save@v4
      with:
        path: 'toolchains/llvm-ios-build

