# Build655 retry: separate generic cache fixtures from approved-default routing.
name: BCD touch app-only update with retained v653 native runtime
'on':
  push:
    branches:
    - wo-bcd-profiles-native-001
    paths:
    - .github/workflows/touch-profiles-ipa.yml
concurrency:
  group: bcd-profiles-ipa
  cancel-in-progress: false
jobs:
  build-test-only:
    runs-on: macos-15-intel
    permissions:
      contents: read
      actions: read
    timeout-minutes: 60
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_UPGRADE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0
    - name: Verify clean source before combined native validation and build
      run: 'git diff --exit-code --ignore-submodules=none

        python3 - <<''CHECK''

        import subprocess

        assert all(s.startswith('' '') for s in subprocess.check_output([''git'',''submodule'',''status'',''--recursive''],text=True).splitlines())

        print(''One combined source validation and TEST IPA build. Phone testing still required.'')

        CHECK'
    - name: Require exact donor runtime sources
      run: 'git diff --exit-code 37815c32296179231362a2aa645eba54827f0f2f HEAD -- wine dxmt FEX madeira-dock build
        madeira-d3d12 app/Frameworks app/Madeira/Assets.xcassets app/Madeira/libgmp.a app/Madeira/libgnutls.a app/Madeira/libhogweed.a
        app/Madeira/libnettle.a app/Madeira/gl app/Madeira/vulkan app/Madeira/d3d12 app/Madeira/aarch64-windows
        app/Madeira/arm64ec-windows app/Madeira/i386-windows

        python3 tests/host/check-v653-donor-reuse.py

        '
    - name: Download and verify exact working v653 donor
      run: 'mkdir -p build-out

        # gh follows GitHub''s signed artifact redirect without exposing the token in logs.

        gh api repos/arjuk95-dot/bcd-touch/actions/artifacts/13955942602/zip > build-out/donor.zip

        python3 tools/touch-packs/reuse-v653-donor.py prepare --artifact build-out/donor.zip --output build-out/donor

        python3 tools/touch-packs/reuse-v653-donor.py stage --prepared build-out/donor --repo "$GITHUB_WORKSPACE"

        '
      env:
        GH_TOKEN: ${{ github.token }}
    - name: Select the previously tested Xcode 26.3
      shell: bash
      run: 'test -d /Applications/Xcode_26.3.app

        sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer

        case "$(uname -m)" in arm64|x86_64) ;; *) exit 1 ;; esac

        xcodebuild -version

        '
    - name: Compile unchanged GL presenter before app relink
      run: xcrun --sdk iphoneos clang -arch arm64 -miphoneos-version-min=17.0 -fobjc-arc -fmodules -Wall -c app/Madeira/Winios/WiniosGL.m
        -o /tmp/WiniosGL.o
    - name: Compile unchanged display shim before app relink
      run: xcrun --sdk iphoneos clang -arch arm64 -miphoneos-version-min=17.0 -fobjc-arc -fmodules -Wall -c app/Madeira/IOSDisplayShim.m
        -o /tmp/IOSDisplayShim.o
    - name: Build number
      id: bn
      shell: bash
      run: "n=$(grep -v '^#' docs/local-build/BUILD-NUMBER | tr -d '[:space:]')\ncase \"$n\" in\n  ''|*[!0-9]*)\
        \ echo \"::error::docs/local-build/BUILD-NUMBER holds no build number\"; exit 1 ;;\nesac\necho \"n=$n\"\
        \ >> \"$GITHUB_OUTPUT\"\necho \"::notice::build $n (GitHub run #${{ github.run_number }})\"\n"
    - name: Toolchain versions
      run: 'xcodebuild -version

        xcrun --sdk iphoneos --show-sdk-path

        xcrun --sdk iphoneos --show-sdk-version

        clang --version

        '
    - name: Verify and restore exact successful build654 native link inputs
      env:
        GH_TOKEN: ${{ github.token }}
      run: 'set -euo pipefail

        base=repos/arjuk95-dot/bcd-touch/actions

        gh api "$base/artifacts/14055382553" > build-out/retained-artifact-metadata.json

        gh api "$base/runs/43453839217" > build-out/retained-run-metadata.json

        gh api "$base/jobs/131982686963" > build-out/retained-job-metadata.json

        gh api "$base/artifacts/14055382553/zip" > build-out/retained-native-inputs.zip

        python3 tools/ci/restore-native-link-inputs.py   --artifact build-out/retained-native-inputs.zip   --artifact-metadata
        build-out/retained-artifact-metadata.json   --run-metadata build-out/retained-run-metadata.json   --job-metadata
        build-out/retained-job-metadata.json   --repo "$GITHUB_WORKSPACE" --receipt build-out/native-link-inputs.json

        BCD_RETAINED_NATIVE_ZIP=build-out/retained-native-inputs.zip python3 tests/host/check-retained-native-inputs.py

        '
    - name: Validate approved default routing and changed production touch code
      run: 'python3 tests/host/check-approved-default-routing.py

        python3 tools/touch-packs/check-swift.py

        python3 tools/touch-packs/simulator-preview.py

        '
      timeout-minutes: 20
    - name: Check control presets
      run: python3 tests/host/check-control-presets.py
    - name: Check preview build cache correctness
      run: python3 tests/host/check-ui-preview-cache.py
    - name: Check BCD's touch controls
      run: python3 tests/host/check-bcd-touch.py --require-swift
    - name: Check the app sources are in the Xcode project
      run: python3 tests/host/check-xcode-sources.py
    - name: Retain verified native inputs for later app-only updates
      uses: actions/upload-artifact@v4
      with:
        name: BCD-v653-retained-native-inputs-654
        path: 'build-out/retained-native-inputs.zip

          build-out/native-link-inputs.json

          build-out/retained-artifact-metadata.json

          build-out/retained-run-metadata.json

          build-out/retained-job-metadata.json'
        retention-days: 30
    - name: Stamp version 0.1.${{ steps.bn.outputs.n }}
      shell: bash
      run: "/usr/libexec/PlistBuddy \\\n  -c \"Set :CFBundleShortVersionString 0.1.${{ steps.bn.outputs.n }}\" \\\
        \n  -c \"Set :CFBundleVersion ${{ steps.bn.outputs.n }}\" \\\n  app/Madeira/Info.plist\necho \"::notice::version\
        \ 0.1.${{ steps.bn.outputs.n }} (build ${{ steps.bn.outputs.n }})\"\n# madeira-bcd: which commit and run\
        \ this IPA is; the D3D12 shader\n# cache identity (tools/build-madeira-d3d12-dll.sh) is only printed:\n\
        # a new one means every D3D12 game converts its shaders once again.\nSCID=$(cat build/madeira-d3d12/out-pe/scid.txt\
        \ 2>/dev/null || true)\nP=app/Madeira/Info.plist\nfor kv in \"MadeiraCommit:${GITHUB_SHA}\" \"MadeiraRepo:${GITHUB_REPOSITORY}\"\
        \ \\\n          \"MadeiraBuilt:$(date -u +%Y-%m-%dT%H:%M:%SZ)\"; do\n  k=${kv%%:*}; v=${kv#*:}\n  /usr/libexec/PlistBuddy\
        \ -c \"Delete :$k\" \"$P\" > /dev/null 2>&1 || true\n  /usr/libexec/PlistBuddy -c \"Add :$k string $v\"\
        \ \"$P\"\ndone\necho \"::notice::shader cache identity ${SCID:-none}\"\n"
    - name: StikJIT interface for the runner's Swift
      shell: bash
      run: 'echo "::notice::$(xcrun swift --version 2>&1 | grep -m1 ''Swift version'')"

        python3 tools/stikjit-interface-compat.py app/Frameworks/StikJIT.xcframework

        '
    - name: Mark IPA metadata as TEST with full suite pending
      run: 'python3 - <<''PY''

        import plistlib

        from pathlib import Path

        path = Path(''app/Madeira/Info.plist'')

        data = plistlib.loads(path.read_bytes())

        data[''BCDValidationStatus''] = ''TEST_ONLY_FULL_SUITE_PENDING''

        data[''BCDFullValidationRun''] = ''43073552781''

        data[''BCDFullValidationRunStatus''] = ''FAILED''

        data[''BCDDeviceValidationStatus''] = ''NOT_RUN''

        path.write_bytes(plistlib.dumps(data, fmt=plistlib.FMT_XML, sort_keys=False))

        PY

        '
    - name: Archive (unsigned)
      shell: bash
      run: "set +e\n# madeira-bcd pool-reserve: BCD_POOL_BSS_MB=1152 in the environment (run.sh / local_ci.py pass\n\
        # it through) compiles JITAllocator.c's exec-time JIT pool reservation in. Unset or 0: the\n# command is\
        \ exactly the one before, and the build carries no reservation.\npool_bss=()\nif [ -n \"${BCD_POOL_BSS_MB:-}\"\
        \ ] && [ \"${BCD_POOL_BSS_MB}\" != \"0\" ]; then\n  pool_bss=(\"GCC_PREPROCESSOR_DEFINITIONS=\\$(inherited)\
        \ BCD_POOL_BSS_MB=${BCD_POOL_BSS_MB}\")\n  echo \"::notice::JIT pool reservation compiled in: BCD_POOL_BSS_MB=${BCD_POOL_BSS_MB}\
        \ (pool-bss)\"\nfi\nxcodebuild -project app/Madeira.xcodeproj \\\n  -scheme Madeira -sdk iphoneos -configuration\
        \ Debug \\\n  CODE_SIGNING_ALLOWED=NO \"${pool_bss[@]}\" \\\n  archive -archivePath build-out/Madeira.xcarchive\
        \ \\\n  > \"$GITHUB_WORKSPACE/archive.log\" 2>&1\nrc=$?\n# A failing xcodebuild buries the diagnostic under\
        \ a multi-kilobyte\n# swift-frontend invocation, so surface just the errors.\nif [ \"$rc\" -ne 0 ]; then\n\
        \  echo \"===== compiler errors =====\"\n  grep -E \"^[^ ].*: (error|fatal error):\" \"$GITHUB_WORKSPACE/archive.log\"\
        \ | head -30\n  # Linker diagnostics carry no \"error:\" prefix, so the undefined\n  # symbol list needs\
        \ matching on its own terms.\n  echo \"===== linker diagnostics =====\"\n  grep -E \"Undefined symbol|^ld:\
        \ |symbol\\(s\\) not found|referenced from|duplicate symbol\" \\\n    \"$GITHUB_WORKSPACE/archive.log\"\
        \ | head -40\n  echo \"===== failing build commands =====\"\n  sed -n '/The following build commands failed/,/failures)/p'\
        \ \\\n    \"$GITHUB_WORKSPACE/archive.log\" | cut -c1-200 | head -15\nfi\nexit \"$rc\"\n"
    - name: Verify the macdrv symbols DXMT resolves at runtime
      shell: bash
      run: "set +e\nBIN=$(find build-out/Madeira.xcarchive -type f -path \"*/Madeira.app/Madeira\" | head -1)\n\
        if [ -z \"$BIN\" ]; then\n  echo \"::error::app binary not found in the archive -- cannot verify export\
        \ check\"\n  exit 1\nfi\necho \"binary: $BIN\"\nxcrun dyld_info -exports \"$BIN\" > exports.txt 2>&1\n#\
        \ Show that the tool produced a listing at all. Reading \"MISS\" off an\n# exports.txt that actually holds\
        \ an error message would look exactly\n# like a stripped symbol, and the whole point of this step is to\
        \ tell\n# those two apart.\necho \"-- dyld_info output: $(wc -l < exports.txt | tr -d ' ') lines --\"\n\
        head -5 exports.txt\n# Did the setting reach the link at all? Two rounds were lost to\n# flags that silently\
        \ never arrived.\necho \"-- did the linker see the export list? --\"\ngrep -c \"madeira-exports\\|exported_symbol\"\
        \ archive.log 2>/dev/null \\\n  | sed \"s/^/  archive.log mentions it this many times: /\"\necho \"-- are\
        \ the definitions even in the binary? (nm) --\"\nnm -gU \"$BIN\" 2>&1 | grep -i \"macdrv\\|win_data\" |\
        \ head -10 \\\n  || echo \"  (nm finds no macdrv symbol -- they are not in the binary at all)\"\necho \"\
        -- every macdrv symbol in the export trie --\"\ngrep -i \"macdrv\\|win_data\" exports.txt | head -20\nMISSING=\"\
        \"\nfor sym in macdrv_functions get_win_data release_win_data \\\n           macdrv_view_create_metal_view\
        \ macdrv_view_get_metal_layer \\\n           macdrv_view_release_metal_view; do\n  if grep -qE \"_$sym\\\
        $\" exports.txt; then\n    echo \"  OK   $sym\"\n  else\n    echo \"  MISS $sym\"; MISSING=\"$MISSING $sym\"\
        \n  fi\ndone\nif [ -n \"$MISSING\" ]; then\n  echo \"::error::main binary does not export ::$MISSING --\
        \ DXMT's dlsym will fail and every D3D11 title renders black\"\n  # Was a warning while the cause was unknown.\
        \ Now that a build with\n  # all six renders, shipping one without them is a regression, and\n  # its only\
        \ symptom is a black screen that says nothing -- three\n  # days were spent reaching that conclusion once.\n\
        \  exit 1\nelse\n  echo \"::notice::all six macdrv symbols are exported\"\nfi\n"
    - name: Assemble donor runtime with new touch app executable
      run: 'python3 tools/touch-packs/reuse-v653-donor.py assemble --prepared build-out/donor --compiled-app build-out/Madeira.xcarchive/Products/Applications/Madeira.app
        --source "$GITHUB_SHA" --output build-out/reused

        python3 tools/touch-packs/reuse-v653-donor.py verify --output build-out/reused

        python3 - <<''SIGN''

        import importlib.util

        spec=importlib.util.spec_from_file_location(''signer'',''tools/ota-variants.py'');s=importlib.util.module_from_spec(spec);spec.loader.exec_module(s)

        s.fakesign(''build-out/reused/Payload/Madeira.app'')

        SIGN

        codesign --verify --deep --strict build-out/reused/Payload/Madeira.app

        (cd build-out/reused && zip -qry ../BCD-Touch-Lab-unsigned.ipa Payload)

        '
    - name: Prepare verified update for the existing BCD slot
      shell: bash
      run: "set -euo pipefail\nsource_ipa=build-out/BCD-Touch-Lab-unsigned.ipa\nsource_sha=$(shasum -a 256 \"$source_ipa\"\
        \ | awk '{print $1}')\npython3 tools/touch-packs/package-sideload.py \"$source_ipa\" \\\n  --mode existing\
        \ --output build-out/existing-update \\\n  --expected-source \"$GITHUB_SHA\" --expected-ipa-sha \"$source_sha\"\
        \n"
    - uses: actions/upload-artifact@v4
      with:
        name: BCD-minimal-touch-existing-update-TEST
        path: 'build-out/existing-update

          build-out/reused/reuse-receipt.json

          build-out/native-link-inputs.json'
        retention-days: 14
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: BCD-minimal-touch-evidence
        path: 'touch-evidence

          *.log

          build-out/*json

          build-out/*txt'
        retention-days: 7
