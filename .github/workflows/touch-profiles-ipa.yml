        python3 tests/host/check-dock-licence-ask.py

        python3 tools/patch-dock-licence-ask.py madeira-dock/src/session.c || echo "::warning::Dock licence-ask patch not
        applied"

        # round 630 (N14Q6D): the two silent install-folder failures (host result 41) report which check failed; log only

        python3 tests/host/check-dock-install-dir-events.py

        python3 tools/patch-dock-install-dir-events.py madeira-dock/src/launch.c || echo "::warning::Dock install-folder events
        patch not applied"

        # round 630 (BN3SXW): the Steam client entries step (42) says which part failed; a failed open is tried once more
        after 1 s

