    - name: Build base libwineserver.a from wine/server sources
      shell: bash
      run: "SDK=$(xcrun --sdk iphoneos --show-sdk-path)\nBD=\"$GITHUB_WORKSPACE/build/wineserver\"\nOBJ=\"$BD/obj\"\
        \nmkdir -p \"$OBJ/base\"\nFLAGS=(-arch arm64 -isysroot \"$SDK\" -miphoneos-version-min=17.0 -O2\n  -I\"\
        $GITHUB_WORKSPACE/wine/include\" -I\"$GITHUB_WORKSPACE/wine/include/wine\"\n  -I\"$GITHUB_WORKSPACE/wine/build-macos/include\"\
        \n  -I\"$BD\" -I\"$GITHUB_WORKSPACE/wine/server\"\n  -I\"$GITHUB_WORKSPACE/build/ntdll-unix/shims\"\n  -include\
        \ \"$BD/config_ios.h\" -include stdarg.h\n  -include \"$BD/unicode_fix.h\" -include \"$BD/wineserver_ios_kill.h\"\
        \n  -DBINDIR=\\\"/usr/local/bin\\\" -DDATADIR=\\\"/usr/local/share\\\"\n  -D__WINESRC__ -DWINE_IOS=1 -Dmain=wineserver_main\n\
        \  -Wno-implicit-function-declaration)\nOK=0; BAD=0; BADLIST=\"\"\nfor src in \"$GITHUB_WORKSPACE\"/wine/server/*.c;\
        \ do\n  n=$(basename \"$src\" .c)\n  if xcrun -sdk iphoneos clang \"${FLAGS[@]}\" -c \"$src\" -o \"$OBJ/base/$n.o\"\
        \ 2>\"$OBJ/base/$n.err\"; then\n    OK=$((OK+1))\n  else\n    BAD=$((BAD+1)); BADLIST=\"$BADLIST $n\"\n\
        \  fi\ndone\necho \"base compile: $OK ok, $BAD failed:$BADLIST\"\necho \"::notice::base wineserver compile\
        \ :: $OK ok, $BAD failed:$BADLIST\"\nar rcs \"$OBJ/libwineserver.a\" \"$OBJ\"/base/*.o\necho \"::notice::base\
        \ libwineserver.a $(wc -c < \"$OBJ/libwineserver.a\" | tr -d ' ') bytes\"\n# surface the first few real\
        \ failures so we can judge if any matter\nM=0\nfor f in $(grep -rl \"error:\" \"$OBJ/base\" --include=\"\
        *.err\" 2>/dev/null | head -3); do\n  M=$((M+1))\n  MSG=$(grep -m3 -A3 \"error:\" \"$f\" | head -c 1200\
        \ | python3 -c \"import sys; print('%0A'.join(sys.stdin.read().splitlines()))\")\n  echo \"::error::base\
        \ compile error in $f :: $MSG\"\ndone\n\n[ \"$OK\" -eq 44 ] && [ \"$BAD\" -eq 0 ]\n"
