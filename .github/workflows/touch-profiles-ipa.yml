name: BCD minimal touch app update preserving v653 runtime
'on':
  push:
    branches:
    - wo-bcd-profiles-native-001
    paths:
    - .github/workflows/touch-profiles-ipa.yml
concurrency:
  group: bcd-profiles-ipa
  cancel-in-progress: false
jobs:
  build-test-only:
    runs-on: macos-15-intel
    permissions:
      contents: read
      actions: read
    timeout-minutes: 90
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_UPGRADE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0
    - name: Verify clean source before combined native validation and build
      run: 'git diff --exit-code --ignore-submodules=none

        python3 - <<''CHECK''

        import subprocess

        assert all(s.startswith('' '') for s in subprocess.check_output([''git'',''submodule'',''status'',''--recursive''],text=True).splitlines())

        print(''One combined source validation and TEST IPA build. Phone testing still required.'')

        CHECK'
    - name: Require exact donor runtime sources
      run: 'git diff --exit-code 37815c32296179231362a2aa645eba54827f0f2f HEAD -- wine dxmt FEX madeira-dock build
        madeira-d3d12 app/Frameworks app/Madeira/Assets.xcassets app/Madeira/libgmp.a app/Madeira/libgnutls.a app/Madeira/libhogweed.a
        app/Madeira/libnettle.a app/Madeira/gl app/Madeira/vulkan app/Madeira/d3d12 app/Madeira/aarch64-windows
        app/Madeira/arm64ec-windows app/Madeira/i386-windows

        python3 tests/host/check-v653-donor-reuse.py

        '
    - name: Download and verify exact working v653 donor
      run: 'mkdir -p build-out

        # gh follows GitHub''s signed artifact redirect without exposing the token in logs.

        gh api repos/arjuk95-dot/bcd-touch/actions/artifacts/13955942602/zip > build-out/donor.zip

        python3 tools/touch-packs/reuse-v653-donor.py prepare --artifact build-out/donor.zip --output build-out/donor

        python3 tools/touch-packs/reuse-v653-donor.py stage --prepared build-out/donor --repo "$GITHUB_WORKSPACE"

        '
      env:
        GH_TOKEN: ${{ github.token }}
    - name: Verify exact historical patch sources before UI and native builds
      run: 'python3 tests/host/check-overlay-base.py

        python3 tests/host/check-overlay-base.py --verify-checkouts'
    - name: Select the previously tested Xcode 26.3
      shell: bash
      run: 'test -d /Applications/Xcode_26.3.app

        sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer

        case "$(uname -m)" in arm64|x86_64) ;; *) exit 1 ;; esac

        xcodebuild -version

        '
    - name: Compile GL presenter before engine builds
      run: xcrun --sdk iphoneos clang -arch arm64 -miphoneos-version-min=17.0 -fobjc-arc -fmodules -Wall -c app/Madeira/Winios/WiniosGL.m
        -o /tmp/WiniosGL.o
    - name: Compile upstream display shim before engine builds
      run: xcrun --sdk iphoneos clang -arch arm64 -miphoneos-version-min=17.0 -fobjc-arc -fmodules -Wall -c app/Madeira/IOSDisplayShim.m
        -o /tmp/IOSDisplayShim.o
    - name: Build number
      id: bn
      shell: bash
      run: "n=$(grep -v '^#' docs/local-build/BUILD-NUMBER | tr -d '[:space:]')\ncase \"$n\" in\n  ''|*[!0-9]*)\
        \ echo \"::error::docs/local-build/BUILD-NUMBER holds no build number\"; exit 1 ;;\nesac\necho \"n=$n\"\
        \ >> \"$GITHUB_OUTPUT\"\necho \"::notice::build $n (GitHub run #${{ github.run_number }})\"\n"
    - name: Toolchain versions
      run: 'xcodebuild -version

        xcrun --sdk iphoneos --show-sdk-path

        xcrun --sdk iphoneos --show-sdk-version

        clang --version

        '
    - name: Wine submodule revision
      id: winerev
      shell: bash
      run: echo "sha=$(git -C wine rev-parse HEAD)" >> "$GITHUB_OUTPUT"
    - name: Restore native wine tools
      id: winenative
      uses: actions/cache/restore@v4
      with:
        path: wine/build-native
        key: wine-native-tools-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.winerev.outputs.sha }}
        fail-on-cache-miss: true
    - name: Restore GnuTLS iOS stack
      id: gnutlscache
      uses: actions/cache/restore@v4
      with:
        path: 'toolchains/gnutls-ios

          build/gnutls-ios/obj

          build/gnutls-ios/src

          '
        key: gnutls-ios-gmp6.3.0-nettle3.10.1-gnutls3.8.9-v1
        fail-on-cache-miss: true
    - name: Restore FFmpeg iOS
      id: ffmpegcache
      uses: actions/cache/restore@v4
      with:
        path: toolchains/ffmpeg-ios
        key: ffmpeg-ios-${{ hashFiles('build/ffmpeg/build.sh', 'build/ffmpeg/src/SHA256SUMS') }}
        fail-on-cache-miss: true
    - name: FEX submodule revision
      id: fexrev
      shell: bash
      run: echo "sha=$(git -C FEX rev-parse HEAD)" >> "$GITHUB_OUTPUT"
    - name: Restore FEX iOS build
      id: fexcache
      uses: actions/cache/restore@v4
      with:
        path: FEX/build-ios
        key: fex-ios-${{ steps.fexrev.outputs.sha }}-v3
        fail-on-cache-miss: true
    - name: Restore LLVM 15.0.7 iOS build
      id: llvmcache
      uses: actions/cache/restore@v4
      with:
        path: 'toolchains/llvm-ios-build

          toolchains/llvm-project

          '
        key: llvm-15.0.7-ios-v2
        fail-on-cache-miss: true
    - name: Verify artifact-backed identical production touch and UIKit evidence
      run: python3 tools/ci/verify-approved-native-evidence.py
      env:
        GH_TOKEN: ${{ github.token }}
      timeout-minutes: 5
    - name: Check control presets
      run: python3 tests/host/check-control-presets.py
    - name: Check preview build cache correctness
      run: python3 tests/host/check-ui-preview-cache.py
    - name: Check BCD's touch controls
      run: python3 tests/host/check-bcd-touch.py --require-swift
    - name: Check the app sources are in the Xcode project
      run: python3 tests/host/check-xcode-sources.py
    - name: Install newer bison (macOS ships an ancient 2.3)
      run: 'brew install bison

        echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"

        '
    - name: Select LLVM tools without building a host compiler from source
      shell: bash
      run: "if [ \"$(uname -m)\" = x86_64 ]; then\n  # Current Homebrew LLVM bottles omit Intel macOS. The macOS\
        \ 15\n  # image already carries these tools; actual PE compilers below\n  # remain the pinned universal\
        \ llvm-mingw 20260421 distribution.\n  prefix=$(brew --prefix llvm@18)\n  for tool in llvm-dlltool llvm-objcopy\
        \ ld.lld; do test -x \"$prefix/bin/$tool\"; done\n  echo \"$prefix/bin\" >> \"$GITHUB_PATH\"\n  \"$prefix/bin/clang\"\
        \ --version\nelse\n  brew install llvm lld\n  echo \"$(brew --prefix llvm)/bin\" >> \"$GITHUB_PATH\"\n \
        \ echo \"$(brew --prefix lld)/bin\" >> \"$GITHUB_PATH\"\nfi\n"
    - name: Check the Wine pin has the OpenGL change
      run: python3 tests/host/check-opengl-wine.py
    - name: Work around wine's uncommitted arm64ec_x64_export_iat.c
      shell: bash
      run: "F=wine/dlls/ntdll/arm64ec_x64_export_iat.c\nif [ -f \"$F\" ]; then\n  echo \"::notice::$F is present\
        \ upstream now -- this step can go\"\nelse\n  printf '/* placeholder: see build-ipa.yml; PE-side only, never\
        \ compiled here */\\n' > \"$F\"\n  echo \"::warning::$F missing from the wine fork -- empty placeholder\
        \ written for makedep\"\nfi\n# dlls/ntdll/unix/sync.c includes build/madeira_cfg.h BEFORE config.h,\n# on\
        \ purpose (ml1122: Wine's headers ban strncpy by macro). makedep\n# treats that ordering as fatal, so configure\
        \ never writes a\n# Makefile. Upstream builds from a long-configured tree and never\n# meets it. Make that\
        \ one sanity check a warning.\nMD=wine/tools/makedep.c\npython3 - \"$MD\" <<'PYEOF'\nimport sys\np = sys.argv[1]\n\
        s = open(p).read()\nold = 'fatal_error( \"%s must be included before other headers\\\\n\", file->name );'\n\
        new = ('fprintf( stderr, \"%s:%d: warning: %s must be included before other headers '\n       '(madeira-bcd\
        \ CI: not fatal)\\\\n\", input_file_name, input_line, file->name );')\nif new in s:\n    print(\"makedep:\
        \ already patched\")\nelif s.count(old) == 1:\n    open(p, \"w\").write(s.replace(old, new))\n    print(\"\
        makedep: config.h ordering check is now a warning\")\nelse:\n    print(\"::error::makedep.c anchor not found\
        \ -- wine moved, review this step\")\n    sys.exit(1)\n# The WoW64 series' wine (125hz pr/wow64-core) includes\
        \ Madeira's\n# iOS shim headers (ios_fastsync.h, ios_srv_stats.h, ...) by bare\n# name; the iOS builds find\
        \ them with -I build/ntdll-unix/shims,\n# makedep does not and stops configure. They are outside the tree\n\
        # like a system header, so skip them the way makedep skips those.\ns = open(p).read()\nold = '    if (make->external)\
        \ return NULL; /* ignore missing files in external libs */\\n'\nnew = old + ('    if (!strncmp( source->name,\
        \ \"ios_\", 4 )) return NULL;  '\n             '/* madeira-bcd CI: build/ntdll-unix/shims */\\n')\nif new\
        \ in s:\n    print(\"makedep: ios_* shims already skipped\")\nelif s.count(old) == 1:\n    open(p, \"w\"\
        ).write(s.replace(old, new))\n    print(\"makedep: missing ios_* shim headers are skipped\")\nelse:\n  \
        \  print(\"::error::makedep.c external-lib anchor not found -- wine moved, review this step\")\n    sys.exit(1)\n\
        PYEOF\n"
    - name: Configure wine (build-macos, cross)
      run: "cd wine\nmkdir -p build-macos\ncd build-macos\n../configure --enable-win64 --disable-tests \\\n  CC=\"\
        xcrun -sdk iphoneos clang -arch arm64 -miphoneos-version-min=17.0\" \\\n  CROSSCC=\"xcrun -sdk iphoneos\
        \ clang -arch arm64 -miphoneos-version-min=17.0\" \\\n  --host=aarch64-apple-darwin --build=x86_64-apple-darwin\
        \ \\\n  --with-wine-tools=\"$GITHUB_WORKSPACE/wine/build-native\" \\\n  --without-freetype --without-fontconfig\
        \ \\\n  --without-x --without-opengl --without-vulkan \\\n  --without-gnutls --without-pcsclite --without-usb\
        \ \\\n  --without-v4l2 --without-gphoto --without-inotify \\\n  --without-sane --without-pulse --without-alsa\
        \ --without-oss \\\n  --without-capi --without-cups --without-krb5 --without-ldap \\\n  --without-netapi\
        \ --without-sdl --without-udev --without-unwind \\\n  > \"$GITHUB_WORKSPACE/wine-configure.log\" 2>&1\n"
    - name: Generate cross-tree headers and patch config.h for iOS SDK
      shell: bash
      run: "make -C wine/build-macos include/all -j\"$(sysctl -n hw.ncpu)\" > \"$GITHUB_WORKSPACE/make-include.log\"\
        \ 2>&1 || true\ncp -n wine/build-native/include/*.h wine/build-macos/include/ 2>/dev/null || true\nCFG=wine/build-macos/include/config.h\n\
        {\n  echo \"\"\n  echo \"/* iOS SDK fixups appended by CI */\"\n  echo \"#undef HAVE_GETATTRLIST\"\n  echo\
        \ \"#ifndef D_TAPE\"\n  echo \"#define D_TAPE 1\"\n  echo \"#endif\"\n  echo \"#ifndef D_DISK\"\n  echo\
        \ \"#define D_DISK 2\"\n  echo \"#endif\"\n  echo \"#ifndef D_TTY\"\n  echo \"#define D_TTY 3\"\n  echo\
        \ \"#endif\"\n  echo \"\"\n  echo \"/* Wine configure runs --without-gnutls here (the host has no\"\n  echo\
        \ \" * gnutls for the iOS sysroot), so config.h defines neither of\"\n  echo \" * these. But dlls/bcrypt/gnutls.c\
        \ is wrapped head-to-toe in\"\n  echo \" * #ifdef HAVE_GNUTLS_CIPHER_INIT and dlls/secur32/schannel_gnutls.c\"\
        \n  echo \" * in #ifdef SONAME_LIBGNUTLS -- undefined, both compile to an\"\n  echo \" * EMPTY object, __wine_unix_call_funcs\
        \ is never emitted, and the\"\n  echo \" * app link dies on _bcrypt_unix_call_funcs / _secur32_unix_call_funcs.\"\
        \n  echo \" * We link toolchains/gnutls-ios statically and ios_gnutls_shim.h\"\n  echo \" * rewrites dlopen/dlsym\
        \ onto a static symtab, so the soname string\"\n  echo \" * is only ever pattern-matched, never actually\
        \ dlopen()ed. */\"\n  echo \"#ifndef SONAME_LIBGNUTLS\"\n  echo \"#define SONAME_LIBGNUTLS \\\"libgnutls.so.30\\\
        \"\"\n  echo \"#endif\"\n  echo \"#ifndef HAVE_GNUTLS_CIPHER_INIT\"\n  echo \"#define HAVE_GNUTLS_CIPHER_INIT\
        \ 1\"\n  echo \"#endif\"\n} >> \"$CFG\"\nif [ -f wine/build-macos/include/dwrite.h ]; then\n  echo \"::notice::dwrite.h\
        \ present in cross tree\"\nelse\n  echo \"::error::dwrite.h STILL MISSING\"\n  LS=$(ls wine/build-native/include/\
        \ 2>&1 | head -40 | python3 -c \"import sys; print('%0A'.join(sys.stdin.read().splitlines()))\")\n  echo\
        \ \"::error::native include dir :: $LS\"\n  T=$(tail -n 20 \"$GITHUB_WORKSPACE/make-include.log\" 2>/dev/null\
        \ | python3 -c \"import sys; print('%0A'.join(sys.stdin.read().splitlines()))\")\n  echo \"::error::make\
        \ include tail :: $T\"\nfi\n"
    - name: Require native generated headers
      run: for h in config.h dwrite.h mfobjects.h mftransform.h; do test -s "wine/build-macos/include/$h"; done
    - name: Clone freetype 2.13.3
      run: git clone --depth 1 --branch VER-2-13-3 https://github.com/freetype/freetype.git research/freetype
    - name: Build freetype-ios
      run: bash build/freetype-ios/build.sh
    - name: Verify GnuTLS iOS headers and libs
      shell: bash
      run: "set +e\nshopt -s nullglob\nLIBS=(toolchains/gnutls-ios/lib/*.a)\necho \"gnutls-ios libs: ${#LIBS[@]}\"\
        \nls toolchains/gnutls-ios/include/gnutls/gnutls.h 2>&1\nif [ ! -f toolchains/gnutls-ios/include/gnutls/gnutls.h\
        \ ]; then\n  echo \"::error::gnutls headers missing -- bcrypt/secur32 unixlibs will not link\"\n  exit 1\n\
        fi\n"
    - name: Stage cached FFmpeg link archives
      run: for a in libavformat.a libavcodec.a libswresample.a libavutil.a; do test -s "toolchains/ffmpeg-ios/lib/$a";
        cp "toolchains/ffmpeg-ios/lib/$a" app/Madeira/; done
    - name: Verify FEX iOS archives
      if: success()
      shell: bash
      run: "set +e\nOK=1\nfor a in FEXCore/Source/libFEXCore.a FEXCore/Source/libFEXCore_Base.a \\\n         FEXCore/Source/libJemallocLibs.a\
        \ External/cephes/libcephes_128bit.a \\\n         External/fmt/libfmt.a External/SoftFloat-3e/libsoftfloat_3e.a\
        \ \\\n         External/xxhash/cmake_unofficial/libxxhash.a; do\n  if [ -f \"FEX/build-ios/$a\" ]; then\n\
        \    echo \"  OK   $a ($(wc -c < \"FEX/build-ios/$a\" | tr -d ' ') bytes)\"\n  else\n    echo \"  MISS $a\"\
        ; OK=0\n  fi\ndone\nif [ \"$OK\" -eq 0 ]; then\n  for L in fex-cfg fex-build; do\n    if [ -f \"$L.log\"\
        \ ]; then\n      # Compiler errors beat a blind tail: the real cause is usually\n      # hundreds of lines\
        \ above the end of a ninja log.\n      E=$(grep -E \"error:|CMake Error\" \"$L.log\" | head -40)\n     \
        \ [ -n \"$E\" ] || E=$(tail -n 40 \"$L.log\")\n      echo \"::error::$L.log :: $(printf '%s' \"$E\" | python3\
        \ -c \"import sys; print('%0A'.join(sys.stdin.read().splitlines()))\")\"\n    else\n      echo \"::error::$L.log\
        \ MISSING\"\n    fi\n  done\n  exit 1\nfi\necho \"::notice::all 7 FEX archives present\"\n"
    - name: Verify LLVM iOS build
      if: success()
      shell: bash
      run: "set +e\nshopt -s nullglob\nLIBS=(toolchains/llvm-ios-build/lib/*.a)\nN=${#LIBS[@]}\necho \"llvm-ios-build\
        \ static libs: $N\"\necho \"::notice::llvm-ios-build has $N static libs\"\necho \"-- toolchains tree --\"\
        \nls -la toolchains 2>&1 | head -20\nls -la toolchains/llvm-ios-build 2>&1 | head -20\nif [ \"$N\" -lt 5\
        \ ]; then\n  for L in llvm-host-cfg llvm-host-build llvm-ios-cfg llvm-ios-build; do\n    if [ -f \"$L.log\"\
        \ ]; then\n      T=$(tail -n 30 \"$L.log\" | python3 -c \"import sys; print('%0A'.join(sys.stdin.read().splitlines()))\"\
        )\n      echo \"::error::$L.log tail :: $T\"\n    else\n      echo \"::error::$L.log MISSING\"\n    fi\n\
        \  done\n  exit 1\nfi\n"
    - name: Patch wine with the game text-log mirror
      run: 'python3 tests/host/check-guest-log.py

        python3 tools/patch-wine-guest-log.py wine/dlls/ntdll/unix/file.c

        '
    - name: Patch wine text-log mirror to ignore the [DISPLAY] log level
      run: 'python3 tests/host/check-guest-log-tag.py

        python3 tools/patch-wine-guest-log-tag.py wine/dlls/ntdll/unix/file.c

        '
    - name: Patch wine text-log mirror to mirror the Rockstar service's own files
      run: 'python3 tests/host/check-guest-log-service.py

        python3 tools/patch-wine-guest-log-service.py wine/dlls/ntdll/unix/file.c

        '
    - name: Patch wine text-log mirror to mirror a Ren'Py game's error files
      run: 'python3 tests/host/check-guest-log-renpy.py

        python3 tools/patch-wine-guest-log-renpy.py wine/dlls/ntdll/unix/file.c

        '
    - name: Patch wine text-log mirror to keep the stack trace under an exception line
      run: 'python3 tests/host/check-guest-log-trace.py

        python3 tools/patch-wine-guest-log-trace.py wine/dlls/ntdll/unix/file.c

        '
    - name: Patch wine text-log mirror to drop account names
      run: 'python3 tests/host/check-guest-log-redact.py

        python3 tools/patch-wine-guest-log-redact.py wine/dlls/ntdll/unix/file.c

        '
    - name: Patch wine text-log mirror to hide sign-in values
      run: 'python3 tests/host/check-guest-log-secrets.py

        python3 tools/patch-wine-guest-log-secrets.py wine/dlls/ntdll/unix/file.c

        '
    - name: Patch wine with the guest file trace
      run: python3 tools/patch-wine-file-trace.py wine/dlls/ntdll/unix/file.c
    - name: Patch wine with the file-lookup census
      run: 'python3 tests/host/check-wine-file-census.py

        python3 tools/patch-wine-file-census.py wine/dlls/ntdll/unix/file.c

        '
    - name: Check and patch GLOBALROOT DOS paths
      run: 'python3 tests/host/check-globalroot.py

        python3 tools/patch-wine-globalroot.py wine/dlls/ntdll/unix/file.c

        '
    - name: Check and patch opt-in app-local DLL reads
      run: 'python3 tests/host/check-app-local-dll.py

        python3 tools/patch-wine-app-local-dll.py wine/dlls/ntdll/unix/file.c

        '
    - name: Patch wine with size queries from one fstat
      run: python3 tools/patch-wine-file-info-fstat.py wine/dlls/ntdll/unix/file.c
    - name: Patch wine to hide the host's version file from Windows programs
      run: 'python3 tests/host/check-hide-host-version-plist.py

        python3 tools/patch-wine-hide-host-version-plist.py wine/dlls/ntdll/unix/file.c

        '
    - name: Patch wine with the directory-listing census
      run: 'python3 tests/host/check-wine-dir-storm.py

        python3 tools/patch-wine-dir-storm.py wine/dlls/ntdll/unix/file.c

        '
    - name: Patch wine with the DNS trace
      run: python3 tools/patch-wine-dns-trace.py wine/dlls/ws2_32/unixlib.c
    - name: Patch wine so the DNS wrapper can refuse Valve's crash upload host (opt-in)
      run: 'python3 tests/host/check-wine-dns-refuse-crash.py

        python3 tools/patch-wine-dns-refuse-crash.py wine/dlls/ws2_32/unixlib.c

        '
    - name: Patch wine CPU-error diagnostics
      run: python3 tools/patch-wine-cpu-error-diag.py wine
    - name: Patch wine with fault-safe waiter diagnostics
      run: python3 tools/patch-wine-waiter-read.py wine/dlls/ntdll/unix/sync.c
    - name: Patch wine with the opt-in safe orphan-lock reaper
      run: 'python3 tests/host/check-lock-orphan.py

        python3 tools/patch-wine-lock-orphan.py wine/dlls/ntdll/unix/sync.c

        '
    - name: Patch wine with the fault-safe orphan-lock reads
      run: 'python3 tests/host/check-orphan-safe-read.py

        python3 tools/patch-wine-orphan-safe-read.py wine/dlls/ntdll/unix/sync.c

        '
    - name: Patch wine with the opt-in yield mode
      run: python3 tools/patch-wine-yield-mode.py wine/dlls/ntdll/unix/sync.c
    - name: Patch wine so non-alertable sleeps can run I/O completions
      run: python3 tools/patch-wine-sleep-kernel-apc.py wine/dlls/ntdll/unix/sync.c
    - name: Patch wine so an infinite wait on an address can re-check every second
      run: python3 tools/patch-wine-woa-recheck.py wine/dlls/ntdll/sync.c wine/dlls/ntdll/unix/sync.c
    - name: Patch wine with the opt-in available memory
      run: 'python3 tests/host/check-avail-phys.py

        python3 tools/patch-wine-avail-phys.py wine/dlls/ntdll/unix/system.c

        '
    - name: Build ntdll-unix
      run: bash build/ntdll-unix/build.sh 2>&1 | tee "$GITHUB_WORKSPACE/ntdll.log"; exit ${PIPESTATUS[0]}
    - name: Verify ntdll-unix exports the crypto call tables
      shell: bash
      run: "set +e\nOBJ=build/ntdll-unix/obj\n# nm's own flags do the filtering -- -g external, -U defined-only\
        \ --\n# so match on the symbol name alone. Anchoring the whole line\n# against \"addr TYPE _name\" is what\
        \ made this check report every\n# table missing even when the objects plainly defined them: the\n# archive-member\
        \ output format does not match that shape.\nnm -gU app/Madeira/libntdll_unix.a 2>/dev/null \\\n  | awk '{print\
        \ $NF}' | sort -u > defined-syms.txt\necho \"defined external symbols in libntdll_unix.a: $(wc -l < defined-syms.txt\
        \ | tr -d ' ')\"\nMISSING=\"\"\nfor s in bcrypt_unix_call_funcs secur32_unix_call_funcs crypt32_unix_call_funcs\
        \ \\\n         ws2_32_unix_call_funcs dwrite_unix_call_funcs winedmo_unix_call_funcs \\\n         opengl32_unix_call_funcs\
        \ opengl32_unix_call_wow64_funcs winevulkan_unix_call_funcs; do\n  if grep -qx \"_$s\" defined-syms.txt;\
        \ then\n    echo \"  OK   $s (defined)\"\n  else\n    echo \"  MISS $s\"; MISSING=\"$MISSING $s\"\n  fi\n\
        done\necho \"-- object sizes (an empty object means its #ifdef guard was off) --\"\nfor o in ws2_32_unixlib\
        \ bcrypt_unixlib secur32_unixlib crypt32_unixlib dwrite_unixlib winedmo_unixlib opengl32_wgl opengl32_thunks\
        \ winevulkan_vulkan winevulkan_thunks; do\n  if [ -f \"$OBJ/$o.o\" ]; then\n    printf '  %-18s %8s bytes,\
        \ %s external defs\\n' \"$o\" \\\n      \"$(wc -c < \"$OBJ/$o.o\" | tr -d ' ')\" \\\n      \"$(nm -gU \"\
        $OBJ/$o.o\" 2>/dev/null | wc -l | tr -d ' ')\"\n  else\n    echo \"  $o.o ABSENT\"\n  fi\ndone\nif [ -n\
        \ \"$MISSING\" ]; then\n  echo \"-- raw nm shape for bcrypt_unixlib.o --\"\n  nm -gU \"$OBJ/bcrypt_unixlib.o\"\
        \ 2>&1 | head -5 | cat -A | head -5\n  echo \"::error::libntdll_unix.a defines none of ::$MISSING\"\n  for\
        \ o in bcrypt_unixlib secur32_unixlib crypt32_unixlib; do\n    if [ -s \"$OBJ/$o.err\" ]; then\n      E=$(grep\
        \ -m4 -B1 -A4 \"error:\" \"$OBJ/$o.err\" | head -c 1500 | python3 -c \"import sys; print('%0A'.join(sys.stdin.read().splitlines()))\"\
        )\n      echo \"::error::$o compile errors :: $E\"\n    fi\n  done\n  exit 1\nfi\n"
