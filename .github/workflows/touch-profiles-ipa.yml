        python3 tools/patch-dock-registry-events.py madeira-dock/src/launch.c || echo "::warning::Dock registry events patch
        not applied"

        # night round 2026-11-11 (ZB8E97, RAC3KD, GNWWRT, GWX5H2, DP9TVR: launch-registry-step=2, error 2 after the retry):
        a missing Steam client key is

        # created instead of ending the start in 42, and a start that still fails says which keys the host sees; env.MADEIRA_DOCK_REGISTRY_CREATE
        = 0 keeps the failure

        python3 tests/host/check-dock-registry-create.py

        python3 tools/patch-dock-registry-create.py madeira-dock/src/launch.c || echo "::warning::Dock registry create patch
        not applied"

        # round 632 (Madeira #519; BCD logs: 24 sessions of 12 Steam games, ceg-result=55, and FRKBN1, ceg-request=0): Valve''s
        CEG step in a

        # Dock session. The registered Steam Client Service is started before the request (env.MADEIRA_DOCK_CEG_SERVICE_START
        = 0 skips it), a request that

        # failed with 55 is asked again (3 times), and an OK with no job on a first request is "already prepared" (replaces
