      run: "shipped() {\n  for f in app/Madeira/i386-windows/{d3d8,d3d9,d3d9shim,d3d9-emulated,d3d11,dxgi,d3d10core,winemetal,ddraw,wined3d,d3dx9_43}.dll;\
        \ do\n    [ -f \"$f\" ] && shasum -a 256 \"$f\"\n  done\n  return 0\n}\nT=\"$(mktemp -d)\"\nshipped > \"$T/before\"\nrc=0\n\
        bash tools/build-cnc-ddraw-dll.sh || rc=$?\nshipped > \"$T/after\"\nif ! cmp -s \"$T/before\" \"$T/after\"; then\n  echo \"\
