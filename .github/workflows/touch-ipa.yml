    - name: Build d3d9-dxmt.dll (DXMT Direct3D 9 for 64-bit games, arm64ec)
      continue-on-error: true
      shell: bash
      run: "shipped() {\n  for f in app/Madeira/arm64ec-windows/{d3d9,d3d11,dxgi,d3d10core,winemetal}.dll \\\n           app/Madeira/i386-windows/{d3d9,d3d9shim,d3d9-emulated,d3d11,dxgi,d3d10core,winemetal}.dll;\
        \ do\n    [ -f \"$f\" ] && shasum -a 256 \"$f\"\n  done\n  return 0\n}\nT=\"$(mktemp -d)\"\nshipped > \"$T/before\"\nrc=0\n\
        bash tools/build-d3d9-x64-dll.sh || rc=$?\nshipped > \"$T/after\"\nif ! cmp -s \"$T/before\" \"$T/after\"; then\n  echo \"::error::a\
        \ shipped Direct3D / DXGI / winemetal DLL changed while d3d9-dxmt.dll was built:\"\n  diff \"$T/before\" \"$T/after\" || true\n\
        \  exit 1\nfi\necho \"::notice::the $(wc -l < \"$T/before\" | tr -d ' ') shipped d3d9, d3d11, dxgi, d3d10core and winemetal\
        \ DLLs are byte for byte what they were before d3d9-dxmt.dll was built\"\nexit \"$rc\"\n"
    - name: Build d3d8to9.dll (Direct3D 8 on Direct3D 9, i386)
      continue-on-error: true
      shell: bash
      run: "shipped() {\n  for f in app/Madeira/i386-windows/{d3d8,d3d9,d3d9shim,d3d9-emulated,d3d11,dxgi,d3d10core,winemetal,ddraw,wined3d,d3dx9_43}.dll;\
        \ do\n    [ -f \"$f\" ] && shasum -a 256 \"$f\"\n  done\n  return 0\n}\nT=\"$(mktemp -d)\"\nshipped > \"$T/before\"\nrc=0\n\
        bash tools/build-d3d8to9-dll.sh || rc=$?\nshipped > \"$T/after\"\nif ! cmp -s \"$T/before\" \"$T/after\"; then\n  echo \"::error::a\
        \ shipped Direct3D / DirectDraw / DXGI / winemetal DLL of the i386 farm changed while d3d8to9.dll was built:\"\n  diff \"$T/before\"\
