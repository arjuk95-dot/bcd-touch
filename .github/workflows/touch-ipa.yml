    - name: Patch FEX IOS_RPM_GUARD for the system-allocator branch
      if: steps.fexcache.outputs.cache-hit != 'true'
      shell: bash
      run: "python3 - FEX/FEXCore/Source/Utils/AllocatorHooks.cpp <<'PYEOF'\nimport sys\np = sys.argv[1]\ns = open(p).read()\nguard\
        \ = \"#ifndef IOS_RPM_GUARD\\n#define IOS_RPM_GUARD() ((void)0)\\n#endif\\n\"\nanchor = \"size_t malloc_usable_size(void* ptr)\
        \ {\\n  IOS_RPM_GUARD();\"\nif guard in s:\n    print(\"AllocatorHooks.cpp: already patched\")\nelif s.count(anchor) >= 1:\n\
        \    # Twice: the allocator and system-allocator branches. In the first\n    # the macro already exists, so the #ifndef is inert\
        \ there.\n    open(p, \"w\").write(s.replace(anchor, guard + anchor))\n    print(\"AllocatorHooks.cpp: IOS_RPM_GUARD fallback\
        \ added\")\nelif \"IOS_RPM_GUARD\" not in s:\n    print(\"AllocatorHooks.cpp: no IOS_RPM_GUARD any more -- step can go\")\n\
        else:\n    print(\"::error::AllocatorHooks.cpp anchor moved -- review this step\")\n    sys.exit(1)\nPYEOF\n"
    - name: Guard FEX diagnostic probes for the iOS static-lib target
      if: steps.fexcache.outputs.cache-hit != 'true'
      run: python3 tools/patch-fex-ios-probes.py
    - name: Build FEX for iOS
      if: steps.fexcache.outputs.cache-hit != 'true'
      continue-on-error: true
      shell: bash
      run: "# Apple builds skip Source/ (Linux-only tools) via `if (NOT APPLE)`,\n# so only the libraries Xcode links get built.\n#\
        \ CMAKE_SYSTEM_NAME=iOS puts CMake in cross mode, where it does not\n# infer CMAKE_SYSTEM_PROCESSOR -- FEX's CMakeLists.txt:89\
        \ then does\n# string(TOLOWER) on an empty value and aborts with \"Unsupported\n# processor type .\" Its regex accepts ^aarch64.\n\
        cmake -S FEX -B FEX/build-ios -G Ninja \\\n  -DCMAKE_SYSTEM_NAME=iOS \\\n  -DCMAKE_SYSTEM_PROCESSOR=aarch64 \\\n  -DCMAKE_OSX_SYSROOT=\"\
        $(xcrun --sdk iphoneos --show-sdk-path)\" \\\n  -DCMAKE_OSX_ARCHITECTURES=arm64 \\\n  -DCMAKE_OSX_DEPLOYMENT_TARGET=17.0 \\\n\
        \  -DCMAKE_BUILD_TYPE=Release \\\n  -DCMAKE_MACOSX_BUNDLE=OFF \\\n  -DBUILD_TESTING=OFF -DBUILD_FEXCONFIG=OFF -DBUILD_THUNKS=OFF\
        \ \\\n  -DENABLE_LTO=OFF -DENABLE_CCACHE=OFF \\\n  -DTUNE_CPU=generic -DTUNE_ARCH=generic \\\n  -DCMAKE_DISABLE_FIND_PACKAGE_fmt=ON\
        \ \\\n  > \"$GITHUB_WORKSPACE/fex-cfg.log\" 2>&1\n# Explicit targets: `all` would also build FEXCore_shared, which we\n# don't\
        \ link and which needs dylib settings iOS won't give us.\ncmake --build FEX/build-ios -j\"$(sysctl -n hw.ncpu)\" \\\n  --target\
        \ FEXCore FEXCore_Base JemallocLibs \\\n           cephes_128bit softfloat_3e fmt xxhash \\\n  -- -k 0 > \"$GITHUB_WORKSPACE/fex-build.log\"\
        \ 2>&1\n"
    - name: Verify FEX iOS archives
      if: always()
      continue-on-error: true
      shell: bash
      run: "set +e\nOK=1\nfor a in FEXCore/Source/libFEXCore.a FEXCore/Source/libFEXCore_Base.a \\\n         FEXCore/Source/libJemallocLibs.a\
        \ External/cephes/libcephes_128bit.a \\\n         External/fmt/libfmt.a External/SoftFloat-3e/libsoftfloat_3e.a \\\n       \
        \  External/xxhash/cmake_unofficial/libxxhash.a; do\n  if [ -f \"FEX/build-ios/$a\" ]; then\n    echo \"  OK   $a ($(wc -c <\
        \ \"FEX/build-ios/$a\" | tr -d ' ') bytes)\"\n  else\n    echo \"  MISS $a\"; OK=0\n  fi\ndone\nif [ \"$OK\" -eq 0 ]; then\n\
        \  for L in fex-cfg fex-build; do\n    if [ -f \"$L.log\" ]; then\n      # Compiler errors beat a blind tail: the real cause\
        \ is usually\n      # hundreds of lines above the end of a ninja log.\n      E=$(grep -E \"error:|CMake Error\" \"$L.log\" |\
        \ head -40)\n      [ -n \"$E\" ] || E=$(tail -n 40 \"$L.log\")\n      echo \"::error::$L.log :: $(printf '%s' \"$E\" | python3\
        \ -c \"import sys; print('%0A'.join(sys.stdin.read().splitlines()))\")\"\n    else\n      echo \"::error::$L.log MISSING\"\n\
        \    fi\n  done\n  exit 1\nfi\necho \"::notice::all 7 FEX archives present\"\n"
    - name: Save FEX iOS build
