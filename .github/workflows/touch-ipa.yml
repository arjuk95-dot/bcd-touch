    - name: Check the IL2CPP collector-race repair's third pass
      run: python3 tests/host/check-il2cpp-gc-vtable.py
    - name: Check an error status reaches the app whole
      run: python3 tests/host/check-exit-status-whole.py
    - name: Check the stuck-wait registry gives every thread its own slot
      run: python3 tests/host/check-wait-registry-slot.py
    - name: Fetch the VC++ runtime DLLs from Microsoft
      shell: bash
      run: "set +e\nshopt -s nullglob\nDEST=\"$GITHUB_WORKSPACE/app/Madeira/x86_64-vcruntime\"\nWANT=\"concrt140.dll msvcp140.dll msvcp140_1.dll\
        \ msvcp140_2.dll\n      msvcp140_atomic_wait.dll msvcp140_codecvt_ids.dll vcamp140.dll\n      vccorlib140.dll vcomp140.dll vcruntime140.dll\
        \ vcruntime140_1.dll\n      vcruntime140_threads.dll mfc140.dll mfc140u.dll\"\nNWANT=$(echo $WANT | wc -w | tr -d ' ')\ncommand\
        \ -v cabextract >/dev/null 2>&1 || brew install cabextract\ncommand -v msiextract >/dev/null 2>&1 || brew install msitools\n\
        \ncurl -fL --retry 3 --retry-delay 2 -o /tmp/vcr.exe \\\n  https://aka.ms/vs/17/release/vc_redist.x64.exe\nif [ ! -s /tmp/vcr.exe\
        \ ]; then\n  echo \"::warning::VC_redist.x64.exe download failed -- MSVC games will not start\"\n  exit 0\nfi\necho \"downloaded\
        \ $(wc -c < /tmp/vcr.exe | tr -d ' ') bytes\"\n\nrm -rf /tmp/vcx; mkdir -p /tmp/vcx/a /tmp/vcx/carve\ncabextract -q -d /tmp/vcx/a\
        \ /tmp/vcr.exe 2>&1 | tail -3\n\n# Only if the scan came up empty: carve every cabinet out by its\n# MSCF header and its own\
        \ declared length.\nif [ \"$(find /tmp/vcx/a -type f | wc -l | tr -d ' ')\" -lt 2 ]; then\n  python3 - <<'PYEOF'\nimport struct\n\
        d = open('/tmp/vcr.exe', 'rb').read()\nn = off = 0\nwhile True:\n    i = d.find(b'MSCF', off)\n    if i < 0:\n        break\n\
        \    cb = struct.unpack_from('<I', d, i + 8)[0] if i + 36 <= len(d) else 0\n    if 1000 < cb <= len(d) - i:\n        open('/tmp/vcx/carve/c%d.cab'\
        \ % n, 'wb').write(d[i:i + cb])\n        n += 1\n        off = i + cb\n    else:\n        off = i + 4\nprint('carved %d cabinet(s)\
        \ by MSCF header' % n)\nPYEOF\nfi\n\n# The payloads are named <name>.dll_amd64 and <name>.dll_arm64 --\n# not <name>.dll, and\
        \ not the F_CENTRAL_<name>_x64 an MSI cab would\n# use. Rather than chase the spelling, read each candidate's PE\n# header and\
        \ take the one whose machine field is AMD64 (0x8664).\n# Picking up the arm64 build by mistake would fail silently: FEX\n# emulates\
        \ x86-64, so an ARM64 DLL is the wrong binary in a file\n# with the right name.\nis_x64() {\n  python3 -c \"\nimport struct,\
        \ sys\nd = open(sys.argv[1], 'rb').read()\npe = struct.unpack_from('<I', d, 0x3c)[0] if len(d) > 0x40 else 0\nok = d[pe:pe+4]\
        \ == b'PE\\\\0\\\\0' and struct.unpack_from('<H', d, pe+4)[0] == 0x8664\nsys.exit(0 if ok else 1)\" \"$1\" 2>/dev/null\n}\n\n\
        collect() {\n  FOUND=0; MISSING=\"\"\n  for d in $WANT; do\n    base=\"${d%.dll}\"\n    src=\"\"\n    while IFS= read -r cand;\
        \ do\n      if is_x64 \"$cand\"; then src=\"$cand\"; break; fi\n    done < <(find /tmp/vcx -type f \\\n               \\( -iname\
        \ \"$base.dll*\" -o -iname \"F_CENTRAL_${base}_*\" \\) \\\n               -print 2>/dev/null)\n    if [ -n \"$src\" ]; then\n\
        \      cp \"$src\" \"$DEST/$d\" && FOUND=$((FOUND+1))\n    else\n      MISSING=\"$MISSING $d\"\n    fi\n  done\n}\n\n# Peel\
        \ containers until all of them turn up, or nothing new appears.\nfor pass in 1 2 3 4; do\n  BEFORE=$(find /tmp/vcx -type f 2>/dev/null\
        \ | wc -l | tr -d ' ')\n  find /tmp/vcx -type f -size +20k 2>/dev/null | while IFS= read -r f; do\n    case \"${f##*/}\" in\
        \ *.dll|*.DLL|*.exe|*.EXE|*_amd64|*_arm64|*_x86) continue ;; esac\n    [ -d \"$f.d\" ] && continue\n    mkdir -p \"$f.d\"\n\
        \    cabextract -q -d \"$f.d\" \"$f\" > /dev/null 2>&1 \\\n      || msiextract -C \"$f.d\" \"$f\" > /dev/null 2>&1 \\\n    \
        \  || rmdir \"$f.d\" 2>/dev/null\n  done\n  AFTER=$(find /tmp/vcx -type f 2>/dev/null | wc -l | tr -d ' ')\n  collect\n  echo\
        \ \"pass $pass: $BEFORE -> $AFTER files, $FOUND of $NWANT recovered\"\n  [ \"$FOUND\" -eq \"$NWANT\" ] && break\n  [ \"$BEFORE\"\
        \ = \"$AFTER\" ] && break\ndone\n\necho \"::notice::vcruntime :: recovered $FOUND of $NWANT$([ -n \"$MISSING\" ] && echo \"\
        \ -- missing:$MISSING\")\"\n\nif [ \"$FOUND\" -lt \"$NWANT\" ]; then\n  echo \"-- what the installer actually unpacked to (biggest\
        \ 40) --\"\n  find /tmp/vcx -type f -size +20k -exec ls -S {} + 2>/dev/null \\\n    | head -40 | sed \"s|/tmp/vcx/||\"\nfi\n\
        \n# tools/fetch-vcruntime.md: a truncated certificate table means the\n# file is no longer an unmodified Microsoft binary.\n\
        python3 - \"$DEST\"/*.dll <<'PYEOF' || true\nimport struct, sys\nfor path in sys.argv[1:]:\n    d = open(path, 'rb').read()\n\
        \    pe = struct.unpack_from('<I', d, 0x3c)[0]\n    off, size = struct.unpack_from('<II', d, pe + 24 + 112 + 4*8)\n    ok =\
        \ size and off + size <= len(d)\n    print(('  signed  ' if ok else '  UNSIGNED'), path.split('/')[-1])\nPYEOF\n"
    - name: Report vcruntime contents
      shell: bash
      run: "shopt -s nullglob\nDLLS=(app/Madeira/x86_64-vcruntime/*.dll)\necho \"x86_64-vcruntime DLLs present: ${#DLLS[@]} of 14 (12\
        \ C++ runtime + MFC's 2)\"\nif [ \"${#DLLS[@]}\" -lt 14 ]; then\n  echo \"::warning::IPA will build, but games built with MSVC\
        \ will not \\\nstart until the VC++ runtime DLLs are added -- see tools/fetch-vcruntime.md\"\nfi\n"
    - name: Build libmadeira_rppairing.a (Built-in StikJIT pairing)
      shell: bash
      run: 'set -euo pipefail

        command -v rustup >/dev/null || { echo "::error::rustup is not available on this runner"; exit 1; }

        rustup target add aarch64-apple-ios

        bash build/rppairing-ios/build.sh

        '
    - name: Verify all linked archives exist
      shell: bash
      run: "set +e\nMISSING=\"\"\nfor a in libgmp.a libgnutls.a libhogweed.a libnettle.a \\\n         libntdll_unix.a libwin32u_unix.a\
        \ libwineserver.a \\\n         libdxmt_combined.a libmadeira_rppairing.a; do\n  [ -f \"app/Madeira/$a\" ] || MISSING=\"$MISSING\
        \ app/Madeira/$a\"\ndone\nfor a in FEXCore/Source/libFEXCore.a FEXCore/Source/libFEXCore_Base.a \\\n         FEXCore/Source/libJemallocLibs.a\
        \ External/cephes/libcephes_128bit.a \\\n         External/fmt/libfmt.a External/SoftFloat-3e/libsoftfloat_3e.a \\\n       \
        \  External/xxhash/cmake_unofficial/libxxhash.a; do\n  [ -f \"FEX/build-ios/$a\" ] || MISSING=\"$MISSING FEX/build-ios/$a\"\n\
        done\nif [ -n \"$MISSING\" ]; then\n  echo \"::error::archives missing before archive step ::$MISSING\"\n  exit 1\nfi\necho\
        \ \"::notice::all 16 linked archives present\"\n"
    - name: Build matching OpenGL PE DLLs and verify native dispatch
      run: bash tools/opengl/build-pe.sh
    - name: Wait for pinned source dependency build
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: gh run watch "${{ inputs.gl_dependency_run }}" --repo "$GITHUB_REPOSITORY" --exit-status --interval 30
    - name: Download source-built OpenGL dependencies
      uses: actions/download-artifact@v4
      with:
        name: opengl-source-dependencies
        path: .
        run-id: ${{ inputs.gl_dependency_run }}
        github-token: ${{ secrets.GITHUB_TOKEN }}
    - name: Validate dependency source pins and hashes; stage GL metadata
      run: python3 tools/opengl/stage-app.py
    - name: Verify staged GL dependency architecture and load commands
      run: python3 tools/opengl/inspect-dependencies.py
    - name: Generate complete config catalog against the pinned engine sources
      run: 'python3 build/tools/gen-config-catalog.py

        python3 build/tools/gen-autotune-rules.py --check

        mkdir -p build-out

        cp app/Madeira/ConfigCatalog.generated.swift build-out/ConfigCatalog.generated.swift'
    - name: Stage licence copies
      run: bash build/stage-licenses.sh
    - name: Stamp version 0.1.${{ steps.bn.outputs.n }}
      shell: bash
      run: "/usr/libexec/PlistBuddy \\\n  -c \"Set :CFBundleShortVersionString 0.1.${{ steps.bn.outputs.n }}\" \\\n  -c \"Set :CFBundleVersion\
        \ ${{ steps.bn.outputs.n }}\" \\\n  app/Madeira/Info.plist\necho \"::notice::version 0.1.${{ steps.bn.outputs.n }} (build ${{\
        \ steps.bn.outputs.n }})\"\n# madeira-bcd: which commit and run this IPA is; the D3D12 shader\n# cache identity (tools/build-madeira-d3d12-dll.sh)\
        \ is only printed:\n# a new one means every D3D12 game converts its shaders once again.\nSCID=$(cat build/madeira-d3d12/out-pe/scid.txt\
        \ 2>/dev/null || true)\nP=app/Madeira/Info.plist\nfor kv in \"MadeiraCommit:${GITHUB_SHA}\" \"MadeiraRepo:${GITHUB_REPOSITORY}\"\
        \ \\\n          \"MadeiraBuilt:$(date -u +%Y-%m-%dT%H:%M:%SZ)\"; do\n  k=${kv%%:*}; v=${kv#*:}\n  /usr/libexec/PlistBuddy -c\
        \ \"Delete :$k\" \"$P\" > /dev/null 2>&1 || true\n  /usr/libexec/PlistBuddy -c \"Add :$k string $v\" \"$P\"\ndone\necho \"::notice::shader\
        \ cache identity ${SCID:-none}\"\n"
    - name: StikJIT interface for the runner's Swift
      shell: bash
      run: 'echo "::notice::$(xcrun swift --version 2>&1 | grep -m1 ''Swift version'')"

        python3 tools/stikjit-interface-compat.py app/Frameworks/StikJIT.xcframework

        '
    - name: Archive (unsigned)
      shell: bash
      run: "set +e\n# madeira-bcd pool-reserve: BCD_POOL_BSS_MB=1152 in the environment (run.sh / local_ci.py pass\n# it through) compiles\
        \ JITAllocator.c's exec-time JIT pool reservation in. Unset or 0: the\n# command is exactly the one before, and the build carries\
        \ no reservation.\npool_bss=()\nif [ -n \"${BCD_POOL_BSS_MB:-}\" ] && [ \"${BCD_POOL_BSS_MB}\" != \"0\" ]; then\n  pool_bss=(\"\
        GCC_PREPROCESSOR_DEFINITIONS=\\$(inherited) BCD_POOL_BSS_MB=${BCD_POOL_BSS_MB}\")\n  echo \"::notice::JIT pool reservation compiled\
        \ in: BCD_POOL_BSS_MB=${BCD_POOL_BSS_MB} (pool-bss)\"\nfi\nxcodebuild -project app/Madeira.xcodeproj \\\n  -scheme Madeira -sdk\
        \ iphoneos -configuration Debug \\\n  CODE_SIGNING_ALLOWED=NO \"${pool_bss[@]}\" \\\n  archive -archivePath build-out/Madeira.xcarchive\
        \ \\\n  > \"$GITHUB_WORKSPACE/archive.log\" 2>&1\nrc=$?\n# A failing xcodebuild buries the diagnostic under a multi-kilobyte\n\
        # swift-frontend invocation, so surface just the errors.\nif [ \"$rc\" -ne 0 ]; then\n  echo \"===== compiler errors =====\"\
        \n  grep -E \"^[^ ].*: (error|fatal error):\" \"$GITHUB_WORKSPACE/archive.log\" | head -30\n  # Linker diagnostics carry no\
        \ \"error:\" prefix, so the undefined\n  # symbol list needs matching on its own terms.\n  echo \"===== linker diagnostics =====\"\
        \n  grep -E \"Undefined symbol|^ld: |symbol\\(s\\) not found|referenced from|duplicate symbol\" \\\n    \"$GITHUB_WORKSPACE/archive.log\"\
        \ | head -40\n  echo \"===== failing build commands =====\"\n  sed -n '/The following build commands failed/,/failures)/p' \\\
        \n    \"$GITHUB_WORKSPACE/archive.log\" | cut -c1-200 | head -15\nfi\nexit \"$rc\"\n"
    - name: Verify the macdrv symbols DXMT resolves at runtime
      shell: bash
      run: "set +e\nBIN=$(find build-out/Madeira.xcarchive -type f -path \"*/Madeira.app/Madeira\" | head -1)\nif [ -z \"$BIN\" ]; then\n\
        \  echo \"::warning::app binary not found in the archive -- skipping export check\"\n  exit 0\nfi\necho \"binary: $BIN\"\nxcrun\
        \ dyld_info -exports \"$BIN\" > exports.txt 2>&1\n# Show that the tool produced a listing at all. Reading \"MISS\" off an\n\
        # exports.txt that actually holds an error message would look exactly\n# like a stripped symbol, and the whole point of this\
        \ step is to tell\n# those two apart.\necho \"-- dyld_info output: $(wc -l < exports.txt | tr -d ' ') lines --\"\nhead -5 exports.txt\n\
        # Did the setting reach the link at all? Two rounds were lost to\n# flags that silently never arrived.\necho \"-- did the linker\
        \ see the export list? --\"\ngrep -c \"madeira-exports\\|exported_symbol\" archive.log 2>/dev/null \\\n  | sed \"s/^/  archive.log\
        \ mentions it this many times: /\"\necho \"-- are the definitions even in the binary? (nm) --\"\nnm -gU \"$BIN\" 2>&1 | grep\
        \ -i \"macdrv\\|win_data\" | head -10 \\\n  || echo \"  (nm finds no macdrv symbol -- they are not in the binary at all)\"\n\
        echo \"-- every macdrv symbol in the export trie --\"\ngrep -i \"macdrv\\|win_data\" exports.txt | head -20\nMISSING=\"\"\n\
        for sym in macdrv_functions get_win_data release_win_data \\\n           macdrv_view_create_metal_view macdrv_view_get_metal_layer\
        \ \\\n           macdrv_view_release_metal_view; do\n  if grep -qE \"_$sym\\$\" exports.txt; then\n    echo \"  OK   $sym\"\n\
        \  else\n    echo \"  MISS $sym\"; MISSING=\"$MISSING $sym\"\n  fi\ndone\nif [ -n \"$MISSING\" ]; then\n  echo \"::error::main\
        \ binary does not export ::$MISSING -- DXMT's dlsym will fail and every D3D11 title renders black\"\n  # Was a warning while\
        \ the cause was unknown. Now that a build with\n  # all six renders, shipping one without them is a regression, and\n  # its\
        \ only symptom is a black screen that says nothing -- three\n  # days were spent reaching that conclusion once.\n  exit 1\n\
        else\n  echo \"::notice::all six macdrv symbols are exported\"\nfi\n"
    - name: Package separate unsigned test IPA
      run: 'mkdir -p build-out/Payload

        ditto build-out/Madeira.xcarchive/Products/Applications/Madeira.app build-out/Payload/Madeira.app

        python3 - <<''PY''

        import importlib.util

        spec = importlib.util.spec_from_file_location(''bcd_ota_signer'', ''tools/ota-variants.py'')

        signer = importlib.util.module_from_spec(spec)

        spec.loader.exec_module(signer)

        signer.fakesign(''build-out/Payload/Madeira.app'')

        PY

        cd build-out

        zip -qry BCD-Touch-Lab-unsigned.ipa Payload

        '
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: BCD-Touch-Lab-build
        path: 'build-out/BCD-Touch-Lab-unsigned.ipa

          build-out/converter-provenance.json

          build-out/base-runtime-provenance.json

          *.log

          wine/build-arm64ec*.log


          build-out/ConfigCatalog.generated.swift


          app/Madeira/gl/*.json


          app/Madeira/gl/*Revisions*


          app/Madeira/gl/source-submodules.txt'
        if-no-files-found: warn
        retention-days: 7
'on':
  workflow_dispatch:
    inputs:
      runner:
        description: Host runner (all choices produce the same iOS ARM64 target)
        type: choice
        default: macos-15-intel
        options:
        - macos-15
        - macos-26
        - macos-15-intel
      gl_dependency_run:
        description: Successful opengl-dependencies run (source-built Mesa/MoltenVK)
        required: true
        default: '42104253923'
