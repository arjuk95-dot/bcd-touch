    - name: i386 farm revision
      id: i386rev
      shell: bash
      run: echo "key=i386-farm-$(git -C wine rev-parse HEAD)-$(git -C dxmt rev-parse HEAD)-${{ hashFiles('build/wine-i386/build.sh',
        'tools/patch-dxmt-*.py', 'tools/patch-wine-*.py') }}" >> "$GITHUB_OUTPUT"
    - name: Restore i386 farm
      id: i386cache
