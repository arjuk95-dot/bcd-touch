name: BCD Touch Lab unsigned IPA
concurrency:
  group: bcd-touch-ipa-${{ inputs.runner || 'macos-15-intel' }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ${{ inputs.runner || 'macos-15-intel' }}
    permissions:
      contents: read
      actions: read
    timeout-minutes: 360
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_UPGRADE: '1'
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Apply scoped OpenGL Wine source patch
      run: python3 tools/opengl/prepare-wine.py
    - name: Restore pinned converter omitted from upstream Git tree
      run: python3 tools/touch-packs/stage-converter.py
    - name: Select the previously tested Xcode 26.3
      shell: bash
      run: 'test -d /Applications/Xcode_26.3.app

        sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer

        case "$(uname -m)" in arm64|x86_64) ;; *) exit 1 ;; esac

        xcodebuild -version

        '
    - name: Compile GL presenter before engine builds
      run: xcrun --sdk iphoneos clang -arch arm64 -miphoneos-version-min=17.0 -fobjc-arc -fmodules -Wall -c app/Madeira/Winios/WiniosGL.m
        -o /tmp/WiniosGL.o
    - name: Build number
      id: bn
      shell: bash
      run: "n=$(grep -v '^#' docs/local-build/BUILD-NUMBER | tr -d '[:space:]')\ncase \"$n\" in\n  ''|*[!0-9]*) echo \"::error::docs/local-build/BUILD-NUMBER\
        \ holds no build number\"; exit 1 ;;\nesac\necho \"n=$n\" >> \"$GITHUB_OUTPUT\"\necho \"::notice::build $n (GitHub run #${{\
        \ github.run_number }})\"\n"
    - name: Toolchain versions
      run: 'xcodebuild -version

        xcrun --sdk iphoneos --show-sdk-path

        xcrun --sdk iphoneos --show-sdk-version

        clang --version

        '
    - name: Check Windows' command-line tools in the 64-bit system32 (Messiah)
      run: python3 tests/host/check-system32-x86-tools.py
    - name: Install newer bison (macOS ships an ancient 2.3)
      run: 'brew install bison

        echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"

        '
    - name: Select LLVM tools without building a host compiler from source
      shell: bash
      run: "if [ \"$(uname -m)\" = x86_64 ]; then\n  # Current Homebrew LLVM bottles omit Intel macOS. The macOS 15\n  # image already\
        \ carries these tools; actual PE compilers below\n  # remain the pinned universal llvm-mingw 20260421 distribution.\n  prefix=$(brew\
        \ --prefix llvm@18)\n  for tool in llvm-dlltool llvm-objcopy ld.lld; do test -x \"$prefix/bin/$tool\"; done\n  echo \"$prefix/bin\"\
        \ >> \"$GITHUB_PATH\"\n  \"$prefix/bin/clang\" --version\nelse\n  brew install llvm lld\n  echo \"$(brew --prefix llvm)/bin\"\
        \ >> \"$GITHUB_PATH\"\n  echo \"$(brew --prefix lld)/bin\" >> \"$GITHUB_PATH\"\nfi\n"
    - name: Wine submodule revision
      id: winerev
      shell: bash
      run: echo "sha=$(git -C wine rev-parse HEAD)" >> "$GITHUB_OUTPUT"
    - name: Work around wine's uncommitted arm64ec_x64_export_iat.c
      shell: bash
      run: "F=wine/dlls/ntdll/arm64ec_x64_export_iat.c\nif [ -f \"$F\" ]; then\n  echo \"::notice::$F is present upstream now -- this\
        \ step can go\"\nelse\n  printf '/* placeholder: see build-ipa.yml; PE-side only, never compiled here */\\n' > \"$F\"\n  echo\
        \ \"::warning::$F missing from the wine fork -- empty placeholder written for makedep\"\nfi\n# dlls/ntdll/unix/sync.c includes\
        \ build/madeira_cfg.h BEFORE config.h,\n# on purpose (ml1122: Wine's headers ban strncpy by macro). makedep\n# treats that ordering\
        \ as fatal, so configure never writes a\n# Makefile. Upstream builds from a long-configured tree and never\n# meets it. Make\
        \ that one sanity check a warning.\nMD=wine/tools/makedep.c\npython3 - \"$MD\" <<'PYEOF'\nimport sys\np = sys.argv[1]\ns = open(p).read()\n\
        old = 'fatal_error( \"%s must be included before other headers\\\\n\", file->name );'\nnew = ('fprintf( stderr, \"%s:%d: warning:\
        \ %s must be included before other headers '\n       '(madeira-bcd CI: not fatal)\\\\n\", input_file_name, input_line, file->name\
        \ );')\nif new in s:\n    print(\"makedep: already patched\")\nelif s.count(old) == 1:\n    open(p, \"w\").write(s.replace(old,\
        \ new))\n    print(\"makedep: config.h ordering check is now a warning\")\nelse:\n    print(\"::error::makedep.c anchor not\
        \ found -- wine moved, review this step\")\n    sys.exit(1)\n# The WoW64 series' wine (125hz pr/wow64-core) includes Madeira's\n\
        # iOS shim headers (ios_fastsync.h, ios_srv_stats.h, ...) by bare\n# name; the iOS builds find them with -I build/ntdll-unix/shims,\n\
        # makedep does not and stops configure. They are outside the tree\n# like a system header, so skip them the way makedep skips\
        \ those.\ns = open(p).read()\nold = '    if (make->external) return NULL; /* ignore missing files in external libs */\\n'\n\
        new = old + ('    if (!strncmp( source->name, \"ios_\", 4 )) return NULL;  '\n             '/* madeira-bcd CI: build/ntdll-unix/shims\
        \ */\\n')\nif new in s:\n    print(\"makedep: ios_* shims already skipped\")\nelif s.count(old) == 1:\n    open(p, \"w\").write(s.replace(old,\
        \ new))\n    print(\"makedep: missing ios_* shim headers are skipped\")\nelse:\n    print(\"::error::makedep.c external-lib\
        \ anchor not found -- wine moved, review this step\")\n    sys.exit(1)\nPYEOF\n"
    - name: Restore native wine tools
      id: winenative
      uses: actions/cache/restore@v4
      with:
        path: wine/build-native
        key: wine-native-v2-${{ inputs.runner }}-${{ runner.arch }}-${{ steps.winerev.outputs.sha }}
    - name: 'Build native wine (for host-side tools: widl/wrc/wmc)'
      if: steps.winenative.outputs.cache-hit != 'true'
      run: 'set -euo pipefail

        trap ''tail -n 80 "$GITHUB_WORKSPACE/wine-native-configure.log" "$GITHUB_WORKSPACE/wine-native-make.log" 2>/dev/null || true''
        ERR

        cd wine

        mkdir -p build-native

        cd build-native

        W64=""; [ "$(uname -m)" != x86_64 ] || W64=--enable-win64

        ../configure $W64 > "$GITHUB_WORKSPACE/wine-native-configure.log" 2>&1

        N=$(sysctl -n hw.ncpu)

        make -j"$N" __tooldeps__ > "$GITHUB_WORKSPACE/wine-native-make.log" 2>&1

        make -j"$N" include/all >> "$GITHUB_WORKSPACE/wine-native-make.log" 2>&1

        '
    - name: Save native wine tools
      if: steps.winenative.outputs.cache-hit != 'true' && hashFiles('wine/build-native/tools/widl/widl') != ''
      uses: actions/cache/save@v4
      with:
        path: wine/build-native
        key: wine-native-v2-${{ inputs.runner }}-${{ runner.arch }}-${{ steps.winerev.outputs.sha }}
    - name: Diagnose native wine tools build
      run: "echo \"-- looking for widl (proof the native tools built) --\"\nfind wine/build-native/tools -maxdepth 2 -name \"widl*\"\
        \ 2>&1 || echo \"not found\"\nif [ ! -x wine/build-native/tools/widl/widl ]; then\n  echo \"::error::native widl NOT built --\
        \ dumping tails\"\n  NCTAIL=$(tail -n 30 wine-native-configure.log 2>/dev/null | python3 -c \"import sys; print('%0A'.join(sys.stdin.read().splitlines()))\"\
        )\n  echo \"::error::native configure TAIL :: $NCTAIL\"\n  NMTAIL=$(tail -n 40 wine-native-make.log 2>/dev/null | python3 -c\
        \ \"import sys; print('%0A'.join(sys.stdin.read().splitlines()))\")\n  echo \"::error::native make TAIL :: $NMTAIL\"\nelse\n\
        \  echo \"::notice::native widl built OK\"\nfi\n"
    - name: Configure wine (build-macos, cross)
      run: "cd wine\nmkdir -p build-macos\ncd build-macos\n../configure --enable-win64 --disable-tests \\\n  CC=\"xcrun -sdk iphoneos\
        \ clang -arch arm64 -miphoneos-version-min=17.0\" \\\n  CROSSCC=\"xcrun -sdk iphoneos clang -arch arm64 -miphoneos-version-min=17.0\"\
        \ \\\n  --host=aarch64-apple-darwin --build=x86_64-apple-darwin \\\n  --with-wine-tools=\"$GITHUB_WORKSPACE/wine/build-native\"\
        \ \\\n  --without-freetype --without-fontconfig \\\n  --without-x --without-opengl --without-vulkan \\\n  --without-gnutls --without-pcsclite\
        \ --without-usb \\\n  --without-v4l2 --without-gphoto --without-inotify \\\n  --without-sane --without-pulse --without-alsa\
        \ --without-oss \\\n  --without-capi --without-cups --without-krb5 --without-ldap \\\n  --without-netapi --without-sdl --without-udev\
        \ --without-unwind \\\n  > \"$GITHUB_WORKSPACE/wine-configure.log\" 2>&1 || true\n"
    - name: Generate cross-tree headers and patch config.h for iOS SDK
      shell: bash
      run: "make -C wine/build-macos include -j\"$(sysctl -n hw.ncpu)\" > \"$GITHUB_WORKSPACE/make-include.log\" 2>&1 || true\ncp -n\
        \ wine/build-native/include/*.h wine/build-macos/include/ 2>/dev/null || true\nCFG=wine/build-macos/include/config.h\n{\n  echo\
        \ \"\"\n  echo \"/* iOS SDK fixups appended by CI */\"\n  echo \"#undef HAVE_GETATTRLIST\"\n  echo \"#ifndef D_TAPE\"\n  echo\
        \ \"#define D_TAPE 1\"\n  echo \"#endif\"\n  echo \"#ifndef D_DISK\"\n  echo \"#define D_DISK 2\"\n  echo \"#endif\"\n  echo\
        \ \"#ifndef D_TTY\"\n  echo \"#define D_TTY 3\"\n  echo \"#endif\"\n  echo \"\"\n  echo \"/* Wine configure runs --without-gnutls\
        \ here (the host has no\"\n  echo \" * gnutls for the iOS sysroot), so config.h defines neither of\"\n  echo \" * these. But\
        \ dlls/bcrypt/gnutls.c is wrapped head-to-toe in\"\n  echo \" * #ifdef HAVE_GNUTLS_CIPHER_INIT and dlls/secur32/schannel_gnutls.c\"\
        \n  echo \" * in #ifdef SONAME_LIBGNUTLS -- undefined, both compile to an\"\n  echo \" * EMPTY object, __wine_unix_call_funcs\
        \ is never emitted, and the\"\n  echo \" * app link dies on _bcrypt_unix_call_funcs / _secur32_unix_call_funcs.\"\n  echo \"\
        \ * We link toolchains/gnutls-ios statically and ios_gnutls_shim.h\"\n  echo \" * rewrites dlopen/dlsym onto a static symtab,\
        \ so the soname string\"\n  echo \" * is only ever pattern-matched, never actually dlopen()ed. */\"\n  echo \"#ifndef SONAME_LIBGNUTLS\"\
        \n  echo \"#define SONAME_LIBGNUTLS \\\"libgnutls.so.30\\\"\"\n  echo \"#endif\"\n  echo \"#ifndef HAVE_GNUTLS_CIPHER_INIT\"\
        \n  echo \"#define HAVE_GNUTLS_CIPHER_INIT 1\"\n  echo \"#endif\"\n} >> \"$CFG\"\nif [ -f wine/build-macos/include/dwrite.h\
        \ ]; then\n  echo \"::notice::dwrite.h present in cross tree\"\nelse\n  echo \"::error::dwrite.h STILL MISSING\"\n  LS=$(ls\
        \ wine/build-native/include/ 2>&1 | head -40 | python3 -c \"import sys; print('%0A'.join(sys.stdin.read().splitlines()))\")\n\
        \  echo \"::error::native include dir :: $LS\"\n  T=$(tail -n 20 \"$GITHUB_WORKSPACE/make-include.log\" 2>/dev/null | python3\
        \ -c \"import sys; print('%0A'.join(sys.stdin.read().splitlines()))\")\n  echo \"::error::make include tail :: $T\"\nfi\n"
    - name: Diagnose wine build-macos state
      run: "echo \"-- listing wine/build-macos (depth 2) --\"\nfind wine/build-macos -maxdepth 2 2>&1 | head -60 || echo \"wine/build-macos\
        \ missing entirely\"\nif [ -f wine/build-macos/include/config.h ]; then\n  echo \"::notice::config.h EXISTS, $(wc -l < wine/build-macos/include/config.h)\
        \ lines\"\nelse\n  echo \"::error::config.h MISSING at wine/build-macos/include/config.h -- configure did not actually produce\
        \ it\"\n  LINES=$(wc -l < wine-configure.log 2>/dev/null || echo 0)\n  echo \"::error::wine-configure.log has $LINES lines total\"\
        \n  HEAD=$(head -n 25 wine-configure.log 2>/dev/null | python3 -c \"import sys; print('%0A'.join(sys.stdin.read().splitlines()))\"\
        )\n  echo \"::error::configure HEAD :: $HEAD\"\n  TAIL=$(tail -n 40 wine-configure.log 2>/dev/null | python3 -c \"import sys;\
        \ print('%0A'.join(sys.stdin.read().splitlines()))\")\n  echo \"::error::configure TAIL :: $TAIL\"\nfi\n"
    - name: Clone freetype 2.13.3
      run: git clone --depth 1 --branch VER-2-13-3 https://github.com/freetype/freetype.git research/freetype
    - name: Build freetype-ios
      run: bash build/freetype-ios/build.sh
    - name: Restore GnuTLS iOS stack
      id: gnutlscache
      uses: actions/cache/restore@v4
      with:
        path: 'toolchains/gnutls-ios

          build/gnutls-ios/obj

          build/gnutls-ios/src

          '
        key: gnutls-ios-gmp6.3.0-nettle3.10.1-gnutls3.8.9-v1
    - name: Build GnuTLS stack for iOS
      if: steps.gnutlscache.outputs.cache-hit != 'true'
      run: bash build/gnutls-ios/build.sh
    - name: Verify GnuTLS iOS headers and libs
      shell: bash
      run: "set +e\nshopt -s nullglob\nLIBS=(toolchains/gnutls-ios/lib/*.a)\necho \"gnutls-ios libs: ${#LIBS[@]}\"\nls toolchains/gnutls-ios/include/gnutls/gnutls.h\
        \ 2>&1\nif [ ! -f toolchains/gnutls-ios/include/gnutls/gnutls.h ]; then\n  echo \"::error::gnutls headers missing -- bcrypt/secur32\
        \ unixlibs will not link\"\n  exit 1\nfi\n"
    - name: Save GnuTLS iOS stack
      if: steps.gnutlscache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: 'toolchains/gnutls-ios

          build/gnutls-ios/obj

          build/gnutls-ios/src

          '
        key: gnutls-ios-gmp6.3.0-nettle3.10.1-gnutls3.8.9-v1
    - name: Restore FFmpeg iOS
      id: ffmpegcache
      uses: actions/cache/restore@v4
      with:
        path: toolchains/ffmpeg-ios
        key: ffmpeg-ios-${{ hashFiles('build/ffmpeg/build.sh', 'build/ffmpeg/src/SHA256SUMS') }}
    - name: Build FFmpeg for iOS
      shell: bash
      run: "if [ \"${{ steps.ffmpegcache.outputs.cache-hit }}\" = \"true\" ]; then\n  for lib in libavformat libavcodec libswresample\
        \ libavutil; do\n    cp toolchains/ffmpeg-ios/lib/$lib.a app/Madeira/$lib.a\n  done\n  echo \"FFmpeg restored from cache\"\n\
        else\n  bash build/ffmpeg/build.sh\nfi\nls -la app/Madeira/libav*.a app/Madeira/libswresample.a\n"
    - name: Save FFmpeg iOS
      if: steps.ffmpegcache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: toolchains/ffmpeg-ios
        key: ffmpeg-ios-${{ hashFiles('build/ffmpeg/build.sh', 'build/ffmpeg/src/SHA256SUMS') }}
    - name: Patch wine with the game text-log mirror
      run: 'python3 tools/touch-packs/host-test.py tests/host/check-guest-log.py

        python3 tools/patch-wine-guest-log.py wine/dlls/ntdll/unix/file.c

        '
    - name: Patch wine text-log mirror to ignore the [DISPLAY] log level
      run: 'python3 tools/touch-packs/host-test.py tests/host/check-guest-log-tag.py

        python3 tools/patch-wine-guest-log-tag.py wine/dlls/ntdll/unix/file.c

        '
    - name: Patch wine text-log mirror to mirror the Rockstar service's own files
      run: 'python3 tools/touch-packs/host-test.py tests/host/check-guest-log-service.py

        python3 tools/patch-wine-guest-log-service.py wine/dlls/ntdll/unix/file.c

        '
    - name: Patch wine text-log mirror to mirror a Ren'Py game's error files
      run: 'python3 tools/touch-packs/host-test.py tests/host/check-guest-log-renpy.py

        python3 tools/patch-wine-guest-log-renpy.py wine/dlls/ntdll/unix/file.c

        '
    - name: Patch wine text-log mirror to keep the stack trace under an exception line
      run: 'python3 tools/touch-packs/host-test.py tests/host/check-guest-log-trace.py

        python3 tools/patch-wine-guest-log-trace.py wine/dlls/ntdll/unix/file.c

        '
    - name: Patch wine text-log mirror to drop account names
      run: 'python3 tests/host/check-guest-log-redact.py

        python3 tools/patch-wine-guest-log-redact.py wine/dlls/ntdll/unix/file.c

        '
    - name: Patch wine with the guest file trace
      run: python3 tools/patch-wine-file-trace.py wine/dlls/ntdll/unix/file.c
    - name: Patch wine with the file-lookup census
      run: 'python3 tools/touch-packs/host-test.py tests/host/check-wine-file-census.py

        python3 tools/patch-wine-file-census.py wine/dlls/ntdll/unix/file.c

        '
    - name: Patch wine with size queries from one fstat
      run: python3 tools/patch-wine-file-info-fstat.py wine/dlls/ntdll/unix/file.c
    - name: Patch wine to hide the host's version file from Windows programs
      run: 'python3 tests/host/check-hide-host-version-plist.py

        python3 tools/patch-wine-hide-host-version-plist.py wine/dlls/ntdll/unix/file.c

        '
    - name: Patch wine with the DNS trace
      run: python3 tools/patch-wine-dns-trace.py wine/dlls/ws2_32/unixlib.c
    - name: Patch wine d3dx9 volume textures from resources
      run: python3 tools/patch-wine-d3dx9-volume-resource.py wine
    - name: Patch wine xaudio2 engine callbacks (opt-in)
      run: 'python3 tests/host/check-xaudio2-callbacks.py

        python3 tools/patch-wine-xaudio2-callbacks.py wine

        '
    - name: Patch wine vkd3d-shader to read point as a name
      run: 'python3 tests/host/check-vkd3d-point-ident.py

        python3 tools/patch-wine-vkd3d-point-ident.py wine

        '
    - name: Patch wine rpcrt4 named-pipe diagnostics
      run: python3 tools/patch-wine-rpc-np-diag.py wine
    - name: Patch wine CPU-error diagnostics
      run: python3 tools/patch-wine-cpu-error-diag.py wine
    - name: Patch wine with the 64-bit [steam-api] hook
      run: 'python3 tools/touch-packs/host-test.py tests/host/check-steam-api-diag.py

        python3 tools/patch-ntdll-unix-dbg-write-hook.py wine/dlls/ntdll/unix/debug.c

        '
    - name: Patch wine with fault-safe waiter diagnostics
      run: python3 tools/patch-wine-waiter-read.py wine/dlls/ntdll/unix/sync.c
    - name: Patch wine with the opt-in safe orphan-lock reaper
      run: 'python3 tools/touch-packs/host-test.py tests/host/check-lock-orphan.py

        python3 tools/patch-wine-lock-orphan.py wine/dlls/ntdll/unix/sync.c

        '
    - name: Patch wine with the fault-safe orphan-lock reads
      run: 'python3 tests/host/check-orphan-safe-read.py

        python3 tools/patch-wine-orphan-safe-read.py wine/dlls/ntdll/unix/sync.c

        '
    - name: Patch wine with the opt-in yield mode
      run: python3 tools/patch-wine-yield-mode.py wine/dlls/ntdll/unix/sync.c
    - name: Patch wine with the opt-in available memory
      run: 'python3 tools/touch-packs/host-test.py tests/host/check-avail-phys.py

        python3 tools/patch-wine-avail-phys.py wine/dlls/ntdll/unix/system.c

        '
    - name: Build ntdll-unix
      continue-on-error: true
      run: bash build/ntdll-unix/build.sh 2>&1 | tee "$GITHUB_WORKSPACE/ntdll.log"; exit ${PIPESTATUS[0]}
    - name: Verify ntdll-unix exports the crypto call tables
      continue-on-error: true
      shell: bash
      run: "set +e\nOBJ=build/ntdll-unix/obj\n# nm's own flags do the filtering -- -g external, -U defined-only --\n# so match on the\
        \ symbol name alone. Anchoring the whole line\n# against \"addr TYPE _name\" is what made this check report every\n# table missing\
        \ even when the objects plainly defined them: the\n# archive-member output format does not match that shape.\nnm -gU app/Madeira/libntdll_unix.a\
        \ 2>/dev/null \\\n  | awk '{print $NF}' | sort -u > defined-syms.txt\necho \"defined external symbols in libntdll_unix.a: $(wc\
        \ -l < defined-syms.txt | tr -d ' ')\"\nMISSING=\"\"\nfor s in bcrypt_unix_call_funcs secur32_unix_call_funcs crypt32_unix_call_funcs\
        \ \\\n         ws2_32_unix_call_funcs dwrite_unix_call_funcs winedmo_unix_call_funcs; do\n  if grep -qx \"_$s\" defined-syms.txt;\
        \ then\n    echo \"  OK   $s (defined)\"\n  else\n    echo \"  MISS $s\"; MISSING=\"$MISSING $s\"\n  fi\ndone\necho \"-- object\
        \ sizes (an empty object means its #ifdef guard was off) --\"\nfor o in ws2_32_unixlib bcrypt_unixlib secur32_unixlib crypt32_unixlib\
        \ dwrite_unixlib winedmo_unixlib; do\n  if [ -f \"$OBJ/$o.o\" ]; then\n    printf '  %-18s %8s bytes, %s external defs\\n' \"\
        $o\" \\\n      \"$(wc -c < \"$OBJ/$o.o\" | tr -d ' ')\" \\\n      \"$(nm -gU \"$OBJ/$o.o\" 2>/dev/null | wc -l | tr -d ' ')\"\
        \n  else\n    echo \"  $o.o ABSENT\"\n  fi\ndone\nif [ -n \"$MISSING\" ]; then\n  echo \"-- raw nm shape for bcrypt_unixlib.o\
        \ --\"\n  nm -gU \"$OBJ/bcrypt_unixlib.o\" 2>&1 | head -5 | cat -A | head -5\n  echo \"::error::libntdll_unix.a defines none\
        \ of ::$MISSING\"\n  for o in bcrypt_unixlib secur32_unixlib crypt32_unixlib; do\n    if [ -s \"$OBJ/$o.err\" ]; then\n    \
        \  E=$(grep -m4 -B1 -A4 \"error:\" \"$OBJ/$o.err\" | head -c 1500 | python3 -c \"import sys; print('%0A'.join(sys.stdin.read().splitlines()))\"\
        )\n      echo \"::error::$o compile errors :: $E\"\n    fi\n  done\n  exit 1\nfi\n"
    - name: Patch wineserver thread priorities (keep pthread QoS)
      run: python3 tools/patch-wine-thread-qos.py
    - name: Patch the wineserver's cancel_process_async (keep the async alive while it is cancelled)
      run: 'python3 tools/touch-packs/host-test.py tests/host/check-wineserver-async-cancel.py

        python3 tools/patch-wineserver-async-cancel.py wine

        '
    - name: Patch the wineserver's process log
      run: 'python3 tools/touch-packs/host-test.py tests/host/check-wineserver-proc-log.py

        python3 tools/patch-wineserver-proc-log.py wine

        '
    - name: Fetch the General MIDI sound bank
      run: bash tools/fetch-soundfont.sh
    - name: Build base libwineserver.a from wine/server sources
      shell: bash
      run: "SDK=$(xcrun --sdk iphoneos --show-sdk-path)\nBD=\"$GITHUB_WORKSPACE/build/wineserver\"\nOBJ=\"$BD/obj\"\nmkdir -p \"$OBJ/base\"\
        \nFLAGS=(-arch arm64 -isysroot \"$SDK\" -miphoneos-version-min=17.0 -O2\n  -I\"$GITHUB_WORKSPACE/wine/include\" -I\"$GITHUB_WORKSPACE/wine/include/wine\"\
        \n  -I\"$GITHUB_WORKSPACE/wine/build-macos/include\"\n  -I\"$BD\" -I\"$GITHUB_WORKSPACE/wine/server\"\n  -I\"$GITHUB_WORKSPACE/build/ntdll-unix/shims\"\
        \n  -include \"$BD/config_ios.h\" -include stdarg.h\n  -include \"$BD/unicode_fix.h\" -include \"$BD/wineserver_ios_kill.h\"\
        \n  -DBINDIR=\\\"/usr/local/bin\\\" -DDATADIR=\\\"/usr/local/share\\\"\n  -D__WINESRC__ -DWINE_IOS=1 -Dmain=wineserver_main\n\
        \  -Wno-implicit-function-declaration)\nOK=0; BAD=0; BADLIST=\"\"\nfor src in \"$GITHUB_WORKSPACE\"/wine/server/*.c; do\n  n=$(basename\
        \ \"$src\" .c)\n  if xcrun -sdk iphoneos clang \"${FLAGS[@]}\" -c \"$src\" -o \"$OBJ/base/$n.o\" 2>\"$OBJ/base/$n.err\"; then\n\
        \    OK=$((OK+1))\n  else\n    BAD=$((BAD+1)); BADLIST=\"$BADLIST $n\"\n  fi\ndone\necho \"base compile: $OK ok, $BAD failed:$BADLIST\"\
        \necho \"::notice::base wineserver compile :: $OK ok, $BAD failed:$BADLIST\"\nar rcs \"$OBJ/libwineserver.a\" \"$OBJ\"/base/*.o\n\
        echo \"::notice::base libwineserver.a $(wc -c < \"$OBJ/libwineserver.a\" | tr -d ' ') bytes\"\n# surface the first few real\
        \ failures so we can judge if any matter\nM=0\nfor f in $(grep -rl \"error:\" \"$OBJ/base\" --include=\"*.err\" 2>/dev/null\
        \ | head -3); do\n  M=$((M+1))\n  MSG=$(grep -m3 -A3 \"error:\" \"$f\" | head -c 1200 | python3 -c \"import sys; print('%0A'.join(sys.stdin.read().splitlines()))\"\
        )\n  echo \"::error::base compile error in $f :: $MSG\"\ndone\n"
