    - name: Build stand-in DLLs (d3d10, avifil32, vulkan-1)
      continue-on-error: true
      run: "M=toolchains/llvm-mingw-20260421-ucrt-macos-universal/bin\npython3 tools/build-stub-dlls.py wine build/stub-dlls \"$M/arm64ec-w64-mingw32-clang\"\
        \ \\\n  \"$M/llvm-readobj\" app/Madeira/arm64ec-windows\n"
    - name: Verify committed PE DLLs
      shell: bash
      run: "MISSING=\"\"\nfor d in d3d11.dll dxgi.dll winemetal.dll d3d10core.dll; do\n  [ -f \"app/Madeira/aarch64-windows/$d\" ] ||\
        \ MISSING=\"$MISSING aarch64/$d\"\ndone\n# srvcli.dll comes from the extra Wine DLL build: Microsoft Flight\n# Simulator 2024's\
        \ program does not load without it (build 534).\nfor d in d3d11.dll dxgi.dll winemetal.dll d3d12.dll madeira_d3d12.dll xtajit64.dll\
        \ ntdll.dll srvcli.dll; do\n  [ -f \"app/Madeira/arm64ec-windows/$d\" ] || MISSING=\"$MISSING arm64ec/$d\"\ndone\nif [ -n \"\
        $MISSING\" ]; then\n  echo \"::error::PE DLLs missing from app/Madeira ::$MISSING\"\n  exit 1\nfi\necho \"::notice::all PE DLLs\
        \ present\"\n# The ARM64EC source build permits a fallback on failure. This\n# allocator change requires its rebuilt module\
        \ before archiving.\npython3 - <<'PYEOF'\nfrom pathlib import Path\nmodule = Path('app/Madeira/arm64ec-windows/xtajit64.dll').read_bytes()\n\
        if b'rpmalloc-span4 madeira-bcd' not in module:\n    raise SystemExit('Required ARM64EC rpmalloc span4 module was not built;\
        \ refusing the fallback IPA')\nif b'branch-history-v1 madeira-bcd' not in module or b'IosGuestBranchTraceLayout' not in module:\n\
        \    raise SystemExit('Required ARM64EC branch-history module was not built; refusing the fallback IPA')\nif b'launcher-smc-v1\
        \ madeira-bcd' not in module:\n    raise SystemExit('Required ARM64EC Launcher SMC module was not built; refusing the fallback\
        \ IPA')\nif b'smc-store-fastpath-v1 madeira-bcd' not in module:\n    raise SystemExit('Required ARM64EC SMC store fast-path\
        \ module was not built; refusing the fallback IPA')\nif b'callret-elide-v1 madeira-bcd' not in module:\n    raise SystemExit('Required\
        \ ARM64EC call-ret elision module was not built; refusing the fallback IPA')\nif b'ec-ret-v1 madeira-bcd' not in module:\n \
        \   raise SystemExit('Required ARM64EC EC-return module was not built; refusing the fallback IPA')\nif b'ec-bitmap-cache-v1\
        \ madeira-bcd' not in module:\n    raise SystemExit('Required ARM64EC EC-bitmap cache module was not built; refusing the fallback\
        \ IPA')\nif b'ec-exit-lean-v1 madeira-bcd' not in module:\n    raise SystemExit('Required ARM64EC lean JIT exit module was not\
        \ built; refusing the fallback IPA')\nif b'ec-ret-direct-v1 madeira-bcd' not in module:\n    raise SystemExit('Required ARM64EC\
        \ direct return module was not built; refusing the fallback IPA')\nprint('ARM64EC rpmalloc: span4 build marker verified')\n\
        PYEOF\n# Verify the linked x64 entries; never silently ship a fallback DLL\n# that accepts the option but lacks the required\
        \ interop ABI.\npython3 tools/touch-packs/host-test.py tests/host/check-x64-graphics-entry.py \\\n  --factory app/Madeira/arm64ec-windows/dxgi-src.dll\
        \ \\\n  --d3d12 app/Madeira/arm64ec-windows/madeira_d3d12.dll\n# Likewise tools/build-d3d11-dll.sh (env.MADEIRA_D3D11_SRC).\
        \ Round 620: BCD's Direct3D 11\n# patches reach a 64-bit game only through d3d11-src.dll, and recommended lists ask for it\n\
        # (F1 2020), so an IPA in which no 64-bit d3d11.dll carries them is refused.\nNEED=\"\"\n# Round 624: Dark Souls III's [srv-getdesc]\
        \ and WRC 9's [query-stuck] too (build 624's first IPA shipped a\n# d3d11-src.dll without the second: tools/build-d3d11-dll.sh's\
        \ BCD_PATCHES did not name it).\nfor m in \"[copy-structure-count] skipped #\" \"[rtv-fail] #\" \"[srv-getdesc] madeira-bcd\
        \ #\" \"[query-stuck] madeira-bcd query=\" \"[mesh-skip] ml870 \"; do\n  LC_ALL=C grep -aqF \"$m\" app/Madeira/arm64ec-windows/d3d11.dll\
        \ && continue\n  [ -f app/Madeira/arm64ec-windows/d3d11-src.dll ] && LC_ALL=C grep -aqF \"$m\" app/Madeira/arm64ec-windows/d3d11-src.dll\
        \ && continue\n  NEED=\"$NEED \\\"$m\\\"\"\ndone\nif [ -n \"$NEED\" ]; then\n  echo \"::error::no 64-bit d3d11.dll carries BCD's\
        \ Direct3D 11 patches ($NEED): tools/build-d3d11-dll.sh did not ship d3d11-src.dll (see its step)\"\n  exit 1\nfi\nif [ -f app/Madeira/arm64ec-windows/d3d11-src.dll\
        \ ]; then\n  echo \"::notice::d3d11-src.dll present ($(wc -c < app/Madeira/arm64ec-windows/d3d11-src.dll | tr -d ' ') bytes):\
        \ env.MADEIRA_D3D11_SRC = 1 selects it\"\nelif LC_ALL=C grep -aqF \"madeira-bcd: SwapDeviceContextState in use\" app/Madeira/arm64ec-windows/d3d11.dll;\
        \ then\n  echo \"::notice::no d3d11-src.dll: upstream's d3d11.dll carries SwapDeviceContextState itself (dxmt pin 2026-10-15\
        \ and later); env.MADEIRA_D3D11_SRC = 1 keeps it\"\nelse\n  echo \"::warning::d3d11-src.dll missing: this IPA has only upstream's\
        \ d3d11.dll (no SwapDeviceContextState); env.MADEIRA_D3D11_SRC = 1 does nothing\"\nfi\n# And tools/build-wine-extra-dlls.sh's\
        \ ucrtbase-x64math.dll\n# (env.MADEIRA_UCRT_X64_MATH): never ship one whose four exports are\n# not the x64 bodies.\nif [ -f\
        \ app/Madeira/arm64ec-windows/ucrtbase-x64math.dll ]; then\n  python3 tools/patch-wine-ucrtbase-x64-math.py --verify app/Madeira/arm64ec-windows/ucrtbase-x64math.dll\n\
        else\n  echo \"::warning::ucrtbase-x64math.dll missing: env.MADEIRA_UCRT_X64_MATH = 1 does nothing in this IPA\"\nfi\n# And\
        \ its kernelbase-fibertrace.dll (env.MADEIRA_FIBER_TRACE): never ship\n# one without the trace or with other exports than the\
        \ shipped kernelbase.dll.\nif [ -f app/Madeira/arm64ec-windows/kernelbase-fibertrace.dll ]; then\n  python3 tools/patch-wine-kernelbase-fibertrace.py\
        \ --verify app/Madeira/arm64ec-windows/kernelbase-fibertrace.dll \\\n    app/Madeira/arm64ec-windows/kernelbase.dll\nelse\n\
        \  echo \"::warning::kernelbase-fibertrace.dll missing: env.MADEIRA_FIBER_TRACE = 1 does nothing in this IPA\"\nfi\n# And its\
        \ setupapi-optin.dll (env.MADEIRA_OPTIN_DLLS = setupapi): never ship one without the\n# device node lock or with other exports\
        \ than the shipped setupapi.dll.\nif [ -f app/Madeira/arm64ec-windows/setupapi-optin.dll ]; then\n  python3 tools/patch-wine-setupapi-devinst-lock.py\
        \ --verify app/Madeira/arm64ec-windows/setupapi-optin.dll \\\n    app/Madeira/arm64ec-windows/setupapi.dll\nelse\n  echo \"\
        ::warning::setupapi-optin.dll missing: env.MADEIRA_OPTIN_DLLS = setupapi does nothing in this IPA\"\nfi\n# And the ASF source\
        \ of env.MADEIRA_OPTIN_DLLS = mfasfsrcsnk,wmvdecod,wmadmod (Resident Evil 2/7): never ship the\n# handler without the winedmo\
        \ patch (an unpatched one hands the game to the generic handler, which cannot read ASF).\nif [ -f app/Madeira/arm64ec-windows/mfasfsrcsnk-optin.dll\
        \ ]; then\n  python3 tools/patch-wine-mfasfsrcsnk-winedmo.py --verify app/Madeira/arm64ec-windows/mfasfsrcsnk-optin.dll\nelse\n\
        \  echo \"::warning::mfasfsrcsnk-optin.dll missing: env.MADEIRA_OPTIN_DLLS = mfasfsrcsnk does nothing in this IPA\"\nfi\nfor\
        \ d in winedmo.dll wmvdecod-optin.dll wmadmod-optin.dll; do\n  [ -f \"app/Madeira/arm64ec-windows/$d\" ] || echo \"::warning::$d\
        \ missing: Resident Evil 2's cutscenes still end the game in this IPA\"\ndone\n# And its ntdll-sync.dll, which the unix loader\
        \ maps by default: never\n# ship one whose SRW and critical-section exports are not the x64 bodies\n# or whose exports are not\
        \ the shipped ntdll.dll's plus madeira_sync_x64_off.\nif [ -f app/Madeira/arm64ec-windows/ntdll-sync.dll ]; then\n  python3\
        \ tools/patch-wine-ntdll-sync.py --verify app/Madeira/arm64ec-windows/ntdll-sync.dll \\\n    app/Madeira/arm64ec-windows/ntdll.dll\n\
        else\n  echo \"::warning::ntdll-sync.dll missing: every game maps the shipped ntdll.dll\"\nfi\n# And ntdll-xsec.dll (thebcd69/bcd-games#4),\
        \ mapped only by a game with env.MADEIRA_NTDLL_XSEC = 1\n# (Diablo II: Resurrected): an ARM64EC image with the marker, the three\
        \ log strings and the shipped ntdll.dll's exports.\nif [ -f app/Madeira/arm64ec-windows/ntdll-xsec.dll ]; then\n  python3 tools/patch-wine-ntdll-xsec.py\
        \ --verify app/Madeira/arm64ec-windows/ntdll-xsec.dll \\\n    app/Madeira/arm64ec-windows/ntdll.dll\nelse\n  echo \"::warning::ntdll-xsec.dll\
        \ missing: Diablo II: Resurrected's env.MADEIRA_NTDLL_XSEC = 1 maps the shipped ntdll.dll\"\nfi\n"
