# Owner approved public project visibility on 2026-11-17; numeric repository identity verified.
# Transfer is restricted to the specifically
# approved historical engine/iOS source scope. No retail/reference material.
name: Thief2 phase56 controls and lighting public Intel SDK build
on:
  push:
    branches: [thief56-public]
    paths: ['.github/workflows/thief2-phase56.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: thief56-public-exclusive
  cancel-in-progress: false
jobs:
  compile:
    if: github.repository == 'arjuk95-dot/bcd-touch' && github.event.repository.private == false && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build-thief56]'))
    runs-on: macos-15-intel
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    env:
      EXPECTED_REPO: arjuk95-dot/bcd-touch
      EXPECTED_REPO_ID: '1441826178'
      SOURCE_BASE: e876a44c69d725584dba8bb44ae8141c4998d866
    steps:
      - name: Verify destination and reconstruct audited source from public commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import hashlib,json,os,pathlib,subprocess,urllib.request,gzip
          repo=os.environ['EXPECTED_REPO']
          meta=json.loads(subprocess.check_output(['gh','api','repos/'+repo]))
          assert meta['full_name']==os.environ['GITHUB_REPOSITORY']==repo
          assert not meta['private'] and meta['id']==1441826178 and meta['owner']['id']==353064127
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'thief2-source'
          assert not root.exists()
          subprocess.run(['git','-c','core.autocrlf=false','clone','--no-checkout','--depth=1','https://github.com/dima424658/darkengine.git',str(root)],check=True)
          def git(*args): return subprocess.check_output(['git','-C',str(root),'-c','core.autocrlf=false',*args])
          git('fetch','--depth=1','origin',os.environ['SOURCE_BASE'])
          git('checkout','--detach',os.environ['SOURCE_BASE'])
          assert git('rev-parse','HEAD').decode().strip()==os.environ['SOURCE_BASE']
          data=urllib.request.urlopen('https://raw.githubusercontent.com/arjuk95-dot/bcd-touch/'+os.environ['GITHUB_SHA']+'/ci/thief55/public-base-to-phase50.patch.gz',timeout=120).read()
          assert len(data)==3869544 and hashlib.sha256(data).hexdigest()=='72b15c6aac1f64725d0741600f05ea90cb015e6bd49020590fe0b886418dda39'
          patch=gzip.decompress(data)
          assert hashlib.sha256(patch).hexdigest()=='1516027ec283fcf97d86e13beea37534268122862fb84893daaeb9ea62725ce2'
          file=root.parent/'public-to-phase50.patch';file.write_bytes(patch)
          git('apply','--whitespace=nowarn',str(file))
          manifest=json.loads((root/'PRIVATE-SOURCE-MANIFEST.json').read_text())
          assert manifest['base']==os.environ['SOURCE_BASE']
          assert not manifest['retail_assets'] and not manifest['reference_binaries'] and not manifest['credentials']
          entries={f['path']:f for f in manifest['files']}
          names={p.relative_to(root).as_posix() for p in root.rglob('*') if p.is_file() and '.git' not in p.relative_to(root).parts}
          assert len(entries)==4541 and names==set(entries)|{'PRIVATE-SOURCE-MANIFEST.json'}
          for name,f in entries.items():
              data=(root/name).read_bytes()
              assert len(data)==f['bytes'] and hashlib.sha256(data).hexdigest()==f['sha256'].lower(),name
          print('All4541 audited source files match exact phase50 manifest; no private token used.')
      - name: Apply isolated opt-in ragdoll experiment to verified stable source
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/thief2-source"
          python3 - <<'PY'
          import base64,hashlib,pathlib,subprocess,re
          data=base64.b64decode("")
          assert hashlib.sha256(data).hexdigest()=="fcb624749f360fbe0929bd7f4398fc6b8bb59cb36fcfc8a253144a1c26dc9bf8"
          pathlib.Path("../ragdoll-exp51.patch").write_bytes(data)
          # The source ZIP preserves Windows CRLF; the verified Git patch uses LF.
          for name in re.findall(rb"^diff --git a/(\S+) b/",data,re.M):
              p=pathlib.Path(name.decode())
              if p.exists(): p.write_bytes(p.read_bytes().replace(b"\r\n",b"\n"))
          subprocess.run(["git","init","-q"],check=True)
          subprocess.run(["git","apply","--check","../ragdoll-exp51.patch"],check=True)
          subprocess.run(["git","apply","../ragdoll-exp51.patch"],check=True)
          PY
      - name: Apply verified phase56 controls and receiver lighting fixes
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/thief2-source"
          python3 - <<'PY'
          import base64,hashlib,pathlib,re,subprocess
          data=base64.b64decode("")
          assert hashlib.sha256(data).hexdigest()=="409014b65ce3a475995785588dcea6dc841f5b5feab298a13b4e165744dfd7dc"
          pathlib.Path("../phase56.patch").write_bytes(data)
          doc=pathlib.Path("docs/native-ragdolls.md")
          before=doc.read_bytes().replace(bytes([13,10]),bytes([10]))
          assert hashlib.sha256(before).hexdigest()=="453fefaefaa6eecca21423cd9fcd255c07cd2b5984895dc88937b359c00b7712"
          base=before.split(b"\n## Experimental iOS 51 package")[0]
          assert hashlib.sha256(base).hexdigest()=="b2255039c3eb48fdbe7d7429b7c90397764439b82ae90d251dfea98ce3109499"
          doc.write_bytes(base)
          overlay=pathlib.Path("ios/render_overlay.h")
          before=overlay.read_bytes().replace(bytes([13,10]),bytes([10]))
          assert hashlib.sha256(before).hexdigest()=="a0783b8e298cf17220307a733a93d37de351f2c7138982fc8a8b5a739b5f3190"
          a=before.index(b"   static const unsigned char digits[10][7]")
          b=before.index(b"   dark_ios::Control radial[4]",a)
          base=before[:a]+before[b:]
          assert hashlib.sha256(base).hexdigest()=="93e422b7ea389095f962d83c7260f268184e0ee4461eee328cf6c2d2b81f1d67"
          overlay.write_bytes(base)
          for name in re.findall(rb"^diff --git a/(\S+) b/",data,re.M):
              p=pathlib.Path(name.decode())
              if p.exists(): p.write_bytes(p.read_bytes().replace(b"\r\n",b"\n"))
          subprocess.run(["git","apply","--check","../phase56.patch"],check=True)
          subprocess.run(["git","apply","../phase56.patch"],check=True)
          PY
      - name: Apply integrated lighting, performance and ragdoll fixes
        shell: python
        run: |
          import base64,hashlib,os,pathlib,subprocess,re
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'thief2-source'
          data=base64.b64decode("")
          assert hashlib.sha256(data).hexdigest()=="749f4476e446fe35aecd013eec30a37d3d6a8cd440fb4471fa26af0a5cc383a7"
          p=root.parent/'integrated56.patch';p.write_bytes(data)
          for name in re.findall(rb"^diff --git a/(\S+) b/",data,re.M):
              target=root/name.decode()
              if target.exists():target.write_bytes(target.read_bytes().replace(bytes([13,10]),bytes([10])))
          subprocess.run(['git','-C',str(root),'apply','--check',str(p)],check=True)
          subprocess.run(['git','-C',str(root),'apply',str(p)],check=True)
      - name: Run focused host control regression checks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/thief2-results"
          cd "$RUNNER_TEMP/thief2-source"
          node tools/touch_binding_tests.cjs | tee "$RUNNER_TEMP/thief2-results/touch-binding-tests.txt"
          cmake -S tools/ios_host_tests -B .codex-build/host-tests -DCMAKE_BUILD_TYPE=Debug
          cmake --build .codex-build/host-tests --target shadow_pose_cache_tests shadow_face_cull_tests ragdoll_orientation_tests ios_policy_tests ios_touch_gesture_tests ios_control_visual_tests humanoid_ragdoll_tests ios_overlay_tests ios_weapon_radial_tests --parallel 2
          .codex-build/host-tests/shadow_pose_cache_tests | tee "$RUNNER_TEMP/thief2-results/shadow_pose_cache_tests.txt"
          .codex-build/host-tests/shadow_face_cull_tests | tee "$RUNNER_TEMP/thief2-results/shadow_face_cull_tests.txt"
          .codex-build/host-tests/ragdoll_orientation_tests | tee "$RUNNER_TEMP/thief2-results/ragdoll_orientation_tests.txt"
          .codex-build/host-tests/ios_policy_tests | tee "$RUNNER_TEMP/thief2-results/touch-policy-tests.txt"
          .codex-build/host-tests/ios_touch_gesture_tests | tee "$RUNNER_TEMP/thief2-results/touch-gesture-tests.txt"
          .codex-build/host-tests/ios_control_visual_tests | tee "$RUNNER_TEMP/thief2-results/touch-visual-tests.txt"
          .codex-build/host-tests/humanoid_ragdoll_tests | tee "$RUNNER_TEMP/thief2-results/ragdoll-tests.txt"
          .codex-build/host-tests/ios_overlay_tests | tee "$RUNNER_TEMP/thief2-results/overlay-tests.txt"
          .codex-build/host-tests/ios_weapon_radial_tests | tee "$RUNNER_TEMP/thief2-results/weapon-radial-tests.txt"
      - name: Check selected Apple SDK before fetching public dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/thief2-results"
          cd "$RUNNER_TEMP/thief2-source"
          sh tools/ios_build.sh doctor 2>&1 | tee "$RUNNER_TEMP/thief2-results/sdk.txt"
          command -v ninja
          ninja --version | tee -a "$RUNNER_TEMP/thief2-results/sdk.txt"
      - name: Verify changed native ABI and restored engine packing
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/thief2-source"
          probe_status=0
          xcrun --sdk iphoneos clang++ -arch arm64 -miphoneos-version-min=15.0 \
            -std=c++17 -fpack-struct=1 -DDARK_IOS=1 -I"$PWD/h" -fsyntax-only \
            tools/ios_host_tests/native_stat_abi_probe.cpp > "$RUNNER_TEMP/thief2-results/stat-abi.txt" 2>&1 || probe_status=$?
          cat "$RUNNER_TEMP/thief2-results/stat-abi.txt"
          if [ "$probe_status" -ne 0 ]; then exit "$probe_status"; fi
          echo "PASS: native stat size/alignment/offset and restored engine packing" | tee -a "$RUNNER_TEMP/thief2-results/stat-abi.txt"
      - name: Prepare public dependencies and compile exactly one unsigned device target
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/thief2-source"
          sh tools/ios_build.sh prepare 2>&1 | tee "$RUNNER_TEMP/thief2-results/dependencies.txt"
          deps="$PWD/.codex-build/ios-deps"
          apple_cc=$(xcrun --sdk iphoneos --find clang)
          apple_cxx=$(xcrun --sdk iphoneos --find clang++)
          # Same source/SDK settings; Ninja avoids Xcode's per-probe project overhead.
          cmake -S . -B .codex-build/ios-device -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphoneos \
            "-DCMAKE_C_COMPILER=$apple_cc" "-DCMAKE_CXX_COMPILER=$apple_cxx" \
            "-DCMAKE_OBJC_COMPILER=$apple_cc" "-DCMAKE_OBJCXX_COMPILER=$apple_cxx" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -DDARK_BUILD_ENGINE=ON -DDARK_BUILD_THIEF2=ON -DDARK_IOS_BUNDLE_ID=local.private.darkengine.thief2 \
            "-DDARK_SDL2_SOURCE=$deps/SDL2" "-DDARK_OPENAL_SOFT_SOURCE=$deps/openal-soft" \
            "-DDARK_PNG_SOURCE=$deps/libpng" "-DDARK_OGG_SOURCE=$deps/ogg" \
            "-DDARK_VORBIS_SOURCE=$deps/vorbis" "-DDARK_SQUIRREL_SOURCE=$deps/squirrel" \
            2>&1 | tee "$RUNNER_TEMP/thief2-results/configure.txt"
          # Retain complete private diagnostics; bound the browser-visible log.
          build_status=0
          cmake --build .codex-build/ios-device --config RelWithDebInfo --target thief2 --parallel 2 > "$RUNNER_TEMP/thief2-results/compile.txt" 2>&1 || build_status=$?
          tail -n 600 "$RUNNER_TEMP/thief2-results/compile.txt"
          if [ "$build_status" -ne 0 ]; then exit "$build_status"; fi
          app="$PWD/.codex-build/ios-device/Thief2.app"
          test -d "$app"
          xcrun --sdk iphoneos lipo "$app/Thief2" -verify_arch arm64
          # Ninja uses our authored plist; supply the device fields Xcode adds.
          python3 - "$app/Info.plist" <<'PY'
          import pathlib,plistlib,sys
          path=pathlib.Path(sys.argv[1])
          data=plistlib.loads(path.read_bytes())
          data.update({'MinimumOSVersion':'15.0','CFBundleVersion':'56','DarkDiagnosticLabel':'5X IMPULSE TEST','CFBundleShortVersionString':'0.2.2','CFBundleDisplayName':'Thief2','CFBundleIdentifier':'local.private.darkengine.thief2','UIDeviceFamily':[1,2],'CFBundleSupportedPlatforms':['iPhoneOS']})
          path.write_bytes(plistlib.dumps(data))
          PY
          cp docs/native-ragdolls.md "$RUNNER_TEMP/thief2-results/EXPERIMENTAL-README.md"
          mkdir -p "$RUNNER_TEMP/thief2-package/Payload"
          ditto "$app" "$RUNNER_TEMP/thief2-package/Payload/Thief2.app"
          ditto -c -k --keepParent "$RUNNER_TEMP/thief2-package/Payload" "$RUNNER_TEMP/thief2-results/Thief2-Phase56-unsigned.ipa"
          shasum -a 256 "$RUNNER_TEMP/thief2-results/Thief2-Phase56-unsigned.ipa" > "$RUNNER_TEMP/thief2-results/SHA256SUMS.txt"
      - name: Preserve compiler evidence and unsigned IPA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Thief2-phase56
          path: ${{ runner.temp }}/thief2-results
          retention-days: 1
          if-no-files-found: warn
