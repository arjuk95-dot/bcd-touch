name: Touch HUD simulator previews
on: [workflow_dispatch]
jobs:
  preview:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Capture production renderer (no guest game)
        run: python3 tools/touch-packs/simulator-preview.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: touch-simulator-previews
          path: touch-evidence
